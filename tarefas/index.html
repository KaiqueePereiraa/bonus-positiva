<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wasfit gestão</title>
<link rel="icon" href="../assets/wasfit/favicon-64.png">
<script>try{if(localStorage.getItem('wasfit_tema')==='escuro')document.documentElement.dataset.tema='escuro'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/marca.css?v=20261127024402">
<link rel="stylesheet" href="css/app.css?v=20261127024402">
<link rel="stylesheet" href="css/jogo.css?v=20261127024402">
<link rel="stylesheet" href="css/wasfit-tema.css?v=20261127024402">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" defer></script>
</head>
<body>
<div class="app" id="app">
  <aside class="lateral" id="lateral" aria-label="Menu">
    <div class="marca">
      <img class="wasfit-logo so-claro" src="../assets/wasfit/wasfit-logo-light.webp" alt="WasFit">
      <img class="wasfit-logo so-escuro" src="../assets/wasfit/wasfit-logo-dark.webp" alt="WasFit">
    </div>
    <ul class="menu" id="menu"></ul>
    <div class="pe">
      <div class="quem"><div class="avatar" id="avatar"></div><div><b id="nome-usuario"></b><span id="papel-usuario"></span></div></div>
      <div class="acoes"><a id="trocar-area" href="../index.html" hidden>Trocar de área</a><button id="sair" type="button">Sair</button></div>
    </div>
  </aside>
  <div class="principal">
    <header class="topo">
      <button class="btn-menu" id="btn-menu" aria-label="Abrir menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="titulos"><h1 id="titulo">Central de Tarefas</h1><p id="subtitulo"></p></div>
      <span class="licenca" id="licenca" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><b id="licenca-texto"></b></span>
      <div class="conta-chip" id="conta-box" hidden title="Academia"><img id="conta-logo" alt=""><b id="conta-nome"></b></div>
      <select class="ctrl sel-unidade" id="sel-unidade" aria-label="Unidade" hidden></select>
      <a class="hud" id="hud" href="#/meu-dia" hidden aria-label="Seu placar de hoje"></a>
      <button class="sino tema-btn" id="tema" type="button" aria-label="Mudar para o modo escuro" title="Modo claro / escuro">
        <svg class="so-claro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="so-escuro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="sino" id="sino" aria-label="Avisos" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="cont" id="sino-cont" hidden></span>
      </button>
      <div class="painel-sino" id="painel-sino" hidden></div>
    </header>
    <main class="conteudo" id="conteudo"></main>
  </div>
</div>
<script type="module" src="js/app.js?v=20261127024402"></script>
</body>
</html>
