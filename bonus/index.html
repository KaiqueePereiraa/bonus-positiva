<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bônus — Wasfit gestão</title>
<link rel="icon" href="../assets/wasfit/favicon-64.png">
<script>try{if(localStorage.getItem('wasfit_tema')==='escuro')document.documentElement.dataset.tema='escuro'}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/marca.css?v=20261127175440">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fonte);background:var(--bg);color:var(--dark);min-height:100vh;-webkit-font-smoothing:antialiased}
.logo-img{display:block;object-fit:contain;object-position:left center}

/* ── LOGIN ── */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--grad-dark);position:relative;overflow:hidden;padding:24px;
}
/* acento diagonal verde — assinatura da marca Positiva */
#login-screen::before{
  content:"";position:absolute;top:50%;left:-10%;width:120%;height:140px;
  background:var(--grad-brand);opacity:.22;
  transform:translateY(-50%) rotate(-9deg);filter:blur(2px);
}
#login-screen::after{
  content:"";position:absolute;top:0;right:0;width:42%;height:100%;
  background:radial-gradient(circle at 80% 20%,rgba(190,245,117,.10),transparent 60%);
}
.login-box{
  position:relative;z-index:2;
  background:var(--white);border-radius:24px;padding:52px 44px;
  width:100%;max-width:430px;
  box-shadow:0 30px 80px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.04);
}
.login-logo{text-align:center;margin-bottom:36px}
.login-logo .logo-mark{
  height:90px;margin:0 auto 20px;display:flex;
  justify-content:center;align-items:center;
}
.login-logo .logo-mark .logo-img{height:90px;width:auto}
.login-logo h1{
  font-size:24px;font-weight:900;color:var(--dark);
  font-style:italic;letter-spacing:1px;text-transform:uppercase;
}
.login-logo p{
  color:var(--mid);font-size:11px;margin-top:6px;
  text-transform:uppercase;letter-spacing:3px;font-weight:700;
}
.login-logo .divider-line{
  width:48px;height:4px;background:var(--grad-brand);
  border-radius:4px;margin:18px auto 0;
}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-weight:700;font-size:13px;color:var(--navy);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{
  width:100%;padding:12px 16px;border:2px solid var(--gray);border-radius:10px;
  font-family:inherit;font-size:15px;color:var(--dark);
  transition:border-color .2s;outline:none;
}
.form-group input:focus{border-color:var(--navy)}
.btn-login{
  width:100%;padding:15px;background:var(--dark);color:var(--white);
  border:none;border-radius:12px;font-family:inherit;font-size:15px;
  font-weight:800;cursor:pointer;transition:.2s;margin-top:10px;
  text-transform:uppercase;letter-spacing:1px;position:relative;overflow:hidden;
}
.btn-login::after{
  content:"";position:absolute;left:0;bottom:0;width:100%;height:4px;
  background:var(--grad-brand);transform:scaleX(0);transform-origin:left;
  transition:transform .3s;
}
.btn-login:hover{background:var(--navy);transform:translateY(-1px)}
.btn-login:hover::after{transform:scaleX(1)}
.login-error{
  color:var(--danger);font-size:13px;text-align:center;
  margin-top:12px;display:none;
}

/* ── APP ── */
#app{display:none}
.header{
  background:var(--dark);padding:0 32px;height:66px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 16px rgba(33,43,55,.25);
}
.header::after{
  content:"";position:absolute;left:0;bottom:0;width:100%;height:3px;
  background:var(--grad-brand);
}
.header-logo{display:flex;align-items:center;gap:14px}
.header-logo .mark{
  height:42px;display:flex;align-items:center;
}
.header-logo .mark .logo-img{height:42px;width:auto}
.header-logo .wordmark{
  color:var(--white);font-weight:900;font-size:17px;
  font-style:italic;letter-spacing:1px;
}
.header-logo .month{
  color:var(--dark);font-size:12px;margin-left:6px;font-weight:800;
  background:var(--green);padding:4px 12px;border-radius:20px;
}
.header-right{display:flex;align-items:center;gap:16px}
.user-badge{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.1);padding:6px 14px;border-radius:20px;
}
.user-badge .avatar{
  width:28px;height:28px;background:var(--green);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;color:var(--dark);
}
.user-badge .uname{color:var(--white);font-size:13px;font-weight:700}
.user-badge .urole{color:var(--gray);font-size:11px}
.btn-logout{
  background:transparent;border:1.5px solid rgba(255,255,255,.3);
  color:var(--white);padding:6px 14px;border-radius:8px;
  font-family:inherit;font-size:13px;cursor:pointer;transition:.2s;
}
.btn-logout:hover{background:rgba(255,255,255,.1)}

/* ── TABS ── */
.tabs-bar{
  background:var(--white);border-bottom:1px solid #e8eaed;
  padding:0 32px;display:flex;gap:4px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{
  padding:16px 20px;border:none;background:transparent;
  font-family:inherit;font-size:14px;font-weight:700;color:var(--mid);
  cursor:pointer;border-bottom:3px solid transparent;transition:.2s;
  white-space:nowrap;
}
.tab-btn:hover{color:var(--navy)}
.tab-btn.active{color:var(--dark);border-bottom-color:var(--green)}
.tab-btn .badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;background:var(--green);color:var(--dark);
  border-radius:50%;font-size:10px;font-weight:900;margin-left:6px;
}

/* ── CONTENT ── */
.content{padding:28px 32px;max-width:1400px;margin:0 auto}

/* ── KPI CARDS ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.kpi-card{
  background:var(--white);border-radius:var(--radius);padding:24px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.kpi-card::before{
  content:"";position:absolute;left:0;top:0;width:4px;height:100%;
  background:var(--grad-brand);
}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(33,43,55,.14)}
.kpi-card.highlight{background:var(--grad-dark)}
.kpi-card.highlight::before{background:var(--grad-brand)}
.kpi-card.highlight .kpi-label{color:var(--gray)}
.kpi-card.highlight .kpi-value{color:var(--green)}
.kpi-card.highlight .kpi-sub{color:var(--gray)}
.kpi-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mid);margin-bottom:8px}
.kpi-value{font-size:32px;font-weight:900;color:var(--dark);letter-spacing:-.5px}
.kpi-sub{font-size:13px;color:var(--mid);margin-top:4px;font-weight:600}

/* ── CHARTS GRID ── */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
@media(max-width:900px){.charts-grid{grid-template-columns:1fr}}
.chart-card{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.chart-card h3{font-size:15px;font-weight:800;color:var(--dark);margin-bottom:16px;padding-left:12px;border-left:3px solid;border-image:var(--grad-brand) 1}
.chart-card canvas{max-height:260px}

/* ── TABLE ── */
.table-card{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:28px}
.table-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.table-header h3{font-size:15px;font-weight:800;color:var(--dark)}
.search-box{
  padding:8px 14px;border:1.5px solid var(--gray);border-radius:8px;
  font-family:inherit;font-size:13px;outline:none;width:220px;
}
.search-box:focus{border-color:var(--navy)}
.data-table{width:100%;border-collapse:collapse}
.data-table th{
  text-align:left;padding:10px 12px;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;color:var(--mid);
  border-bottom:2px solid #e8eaed;
}
.data-table td{
  padding:12px 12px;font-size:14px;border-bottom:1px solid #f0f2f5;
  vertical-align:middle;
}
.data-table tr:hover td{background:#f8f9fa}
.data-table tr.mine td{background:#f0fff4}
.data-table tr.mine td{border-left:3px solid var(--green)}
.data-table tr.split-pair td{border-bottom:none}
.data-table tr.split-sub td{border-top:1px dashed #e8eaed;padding-top:6px;padding-bottom:12px}
.data-table tr.split-sub td:first-child::before{content:'↳ ';color:var(--gray)}
.data-table tr.split-sub + tr:not(.split-sub) td{border-top:2px solid #e8eaed}
.tag{
  display:inline-flex;align-items:center;padding:3px 10px;
  border-radius:20px;font-size:12px;font-weight:700;
}
.tag-new{background:#e8f5e9;color:#2e7d32}
.tag-renewal{background:#e3f2fd;color:#1565c0}
.tag-disputed{background:#fff3e0;color:#e65100}
.tag-resolved{background:#f3e5f5;color:#6a1b9a}
.tag-coord{background:#fce4ec;color:#880e4f;font-size:11px}
.tag-type{background:#ede7f6;color:#4527a0}
.btn-dispute{
  padding:4px 10px;background:transparent;border:1.5px solid var(--gray);
  border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;
  color:var(--mid);cursor:pointer;transition:.2s;
}
.btn-dispute:hover{border-color:var(--warning);color:var(--warning)}
.btn-sm{
  padding:4px 10px;border:none;border-radius:6px;
  font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
}
.btn-approve{background:#e8f5e9;color:#2e7d32}
.btn-transfer{background:#fff3e0;color:#e65100}
.btn-reject{background:#ffebee;color:#c62828}

/* ── RANKING TABLE ── */
.ranking-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f2f5}
.rank-pos{font-size:18px;font-weight:900;color:var(--gray);width:28px;text-align:center}
.rank-pos.top{color:var(--green)}
.rank-name{flex:1;font-weight:700;font-size:15px}
.rank-bar-wrap{width:160px;height:8px;background:#f0f2f5;border-radius:4px;overflow:hidden}
.rank-bar{height:100%;background:var(--grad-brand);border-radius:4px;transition:width .6s}
.rank-val{font-size:15px;font-weight:900;color:var(--dark);min-width:80px;text-align:right}
.rank-detail{font-size:12px;color:var(--mid)}

/* ── DISPUTES ── */
.dispute-card{
  background:var(--white);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);margin-bottom:12px;
  border-left:4px solid var(--warning);
}
.dispute-card.resolved{border-left-color:var(--success)}
.dispute-meta{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.dispute-reason{font-size:14px;color:var(--dark);margin:8px 0}
.dispute-decision{
  background:#f8f9fa;border-radius:8px;padding:10px 14px;
  font-size:13px;color:var(--mid);margin-top:8px;
}
.dispute-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ── ADMIN PANEL ── */
.admin-section{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:24px}
.admin-section h3{font-size:16px;font-weight:800;color:var(--dark);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f0f2f5}
.user-list{display:grid;gap:10px}
.user-row{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:#f8f9fa;border-radius:10px;
}
.user-avatar{
  width:40px;height:40px;background:var(--navy);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;color:var(--white);font-size:14px;
}
.user-info{flex:1}
.user-info .un{font-weight:700;font-size:14px}
.user-info .up{font-size:12px;color:var(--mid)}
.btn-del{
  padding:6px 12px;background:#ffebee;color:#c62828;border:none;
  border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
}
.btn-edit-pw{
  padding:6px 12px;background:#e3f2fd;color:#1565c0;border:none;
  border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;margin-right:6px;
}
.add-user-form{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.add-user-form input{
  flex:1;min-width:140px;padding:10px 14px;border:1.5px solid var(--gray);
  border-radius:8px;font-family:inherit;font-size:14px;outline:none;
}
.add-user-form input:focus{border-color:var(--navy)}
.btn-add{
  padding:10px 20px;background:var(--dark);color:var(--white);border:none;
  border-radius:8px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
}

/* ── TOGGLE SWITCH ── */
.toggle-switch{display:inline-block;width:44px;height:24px;background:#ccc;border-radius:12px;position:relative;transition:.2s;flex-shrink:0}
.toggle-switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle-switch.on{background:var(--green)}
.toggle-switch.on::after{left:22px}

/* ── MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:1000;align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--white);border-radius:16px;padding:32px;
  width:100%;max-width:500px;max-height:90vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal h3{font-size:18px;font-weight:800;margin-bottom:20px;color:var(--dark)}
.modal textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--gray);border-radius:8px;
  font-family:inherit;font-size:14px;resize:vertical;min-height:100px;outline:none;
}
.modal textarea:focus{border-color:var(--navy)}
.modal-info{
  background:#f8f9fa;border-radius:8px;padding:12px 14px;
  font-size:13px;color:var(--mid);margin-bottom:16px;
}
.modal-info strong{color:var(--dark)}
.modal-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.btn-cancel{
  padding:10px 20px;background:#f0f2f5;color:var(--mid);border:none;
  border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
}
.btn-primary{
  padding:10px 20px;background:var(--dark);color:var(--white);border:none;
  border-radius:8px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
}

/* ── SECTION NAV ── */
.section-nav{
  display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;
}
.sec-btn{
  padding:8px 18px;border:1.5px solid var(--gray);border-radius:20px;
  background:transparent;font-family:inherit;font-size:13px;font-weight:700;
  color:var(--mid);cursor:pointer;transition:.2s;
}
.sec-btn:hover{border-color:var(--navy);color:var(--navy)}
.sec-btn.active{background:var(--dark);color:var(--white);border-color:var(--dark)}

/* ── MY HIGHLIGHT ── */
.my-highlight-bar{
  background:var(--grad-dark);position:relative;overflow:hidden;
  border-radius:var(--radius);padding:26px 28px;margin-bottom:24px;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;
}
.my-highlight-bar::after{
  content:"";position:absolute;right:-5%;top:50%;width:55%;height:90px;
  background:var(--grad-brand);opacity:.16;
  transform:translateY(-50%) rotate(-9deg);
}
.my-highlight-bar>*{position:relative;z-index:1}
.my-highlight-bar .mh-item{text-align:center}
.my-highlight-bar .mh-val{font-size:28px;font-weight:900;color:var(--green)}
.my-highlight-bar .mh-lbl{font-size:12px;color:var(--gray);font-weight:700;text-transform:uppercase}
.my-highlight-bar .divider{width:1px;height:48px;background:rgba(255,255,255,.15)}
.my-highlight-bar .mh-name{font-size:18px;font-weight:900;color:var(--white);flex:1}

/* ── EMPTY STATE ── */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--mid);
}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:15px}

/* ── MISC ── */
.section-panel{display:none}
.section-panel.active{display:block}
.page-title{font-size:23px;font-weight:900;color:var(--dark);margin-bottom:4px;letter-spacing:-.3px}
.page-title::after{content:"";display:block;width:42px;height:4px;background:var(--grad-brand);border-radius:4px;margin-top:10px}
.page-sub{font-size:14px;color:var(--mid);margin-bottom:24px}
select{
  padding:8px 14px;border:1.5px solid var(--gray);border-radius:8px;
  font-family:inherit;font-size:13px;color:var(--dark);background:var(--white);
  outline:none;cursor:pointer;
}
select:focus{border-color:var(--navy)}
.flex-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.coordinator-notice{
  background:#f0fff4;border:1.5px solid #c8e6c9;border-radius:10px;
  padding:10px 16px;font-size:13px;color:#2e7d32;margin-bottom:20px;
  font-weight:600;
}
</style>
<style id="wasfit-bonus">
/* WasFit Gestão (26/11/2026): visual do app.wasfit.com.br por cima do Bônus, com modo claro e escuro (tokens em ../shared/marca.css). */
#login-screen{background:var(--fundo)}
#login-screen::before,#login-screen::after{display:none}
.login-box{background:var(--superficie);border:1px solid var(--borda);box-shadow:0 20px 60px rgba(0,0,0,.08)}
.marca-wasfit{height:34px;width:auto;margin:0 auto 14px;display:block}
.login-logo h1{font-style:normal;text-transform:none;letter-spacing:-.4px;font-weight:700;color:var(--texto)}
.login-logo p{text-transform:none;letter-spacing:0;font-weight:400;color:var(--suave)}
.header{background:var(--fundo);border-bottom:1px solid var(--borda);box-shadow:none}
.header::after{display:none}
.wasfit-logo{height:30px;width:auto;display:block}
.header-logo .wordmark{color:var(--texto);font-style:normal;font-weight:600;font-size:15px;letter-spacing:0;border-left:1px solid var(--borda);padding-left:14px}
.header-logo .month{background:color-mix(in oklch,var(--primaria) 20%,transparent);color:var(--primaria-forte);font-weight:600}
.user-badge{background:var(--superficie);border:1px solid var(--borda)}
.user-badge .avatar{background:var(--primaria);color:var(--primaria-texto)}
.user-badge .uname{color:var(--texto)}
.user-badge .urole{color:var(--suave)}
.btn-logout{border:1px solid var(--borda);color:var(--texto)}
.btn-logout:hover{background:var(--lateral-ativo)}
.tema-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--borda);background:transparent;color:var(--texto);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tema-btn svg{width:19px;height:19px}
.tabs-bar{background:var(--fundo);border-bottom:1px solid var(--borda)}
.kpi-card,.chart-card,.table-card,.admin-section,.modal-overlay .modal,.dispute-card{background:var(--superficie);border:1px solid var(--borda);box-shadow:var(--shadow);color:var(--texto)}
.kpi-label,.data-table th{text-transform:none;letter-spacing:0;font-weight:600}
.page-title{font-style:normal;text-transform:none;letter-spacing:-.5px;font-weight:700}
.data-table tr:hover td{background:var(--muted)}
.data-table tr.mine td{background:color-mix(in oklch,var(--primaria) 9%,transparent)}
.data-table td,.data-table th{border-color:var(--borda)}
.rank-bar-wrap{background:var(--muted)}
.sec-btn.active{background:var(--texto);color:var(--superficie);border-color:var(--texto)}
.btn-login,.btn-primary{background:var(--primaria);color:var(--primaria-texto)}
input,select,textarea{background:var(--superficie);color:var(--texto);border-color:var(--borda)}
.kpi-card.highlight,.my-highlight-bar{--white:#fff;color:#fff}

<script type="module">
// Bônus configurável (27/11/2026): regras por academia (bonus_config) calculadas pelo motor compartilhado
import * as motor from '../shared/bonus-motor.js?v=20261127175440';

<script>
// ══════════════════════════════════════════════
//  SUPABASE — operações por linha (concurrency-safe)
// ══════════════════════════════════════════════
const SB_URL = "https://rolmzfaaivyhycugljlm.supabase.co";
const SB_KEY = "sb_publishable_GzqkJ2H0PY2EP66M-agnDg_6B-p-QWF";
const db = supabase.createClient(SB_URL, SB_KEY);

// Os ids de comissão dividida (cadastro/conversão) usam sufixo -cad/-conv/-full/-ren;
// o id "limpo" (matrícula/aluno) é o mesmo sufixo removido — evita precisar de coluna extra no Supabase.
function saleIdFromLine(lineId) {
  return String(lineId || '').replace(/-(cad|conv|full|ren)$/, '');
}

// O papel (cadastro/conversão/etc) também vem do sufixo do line_id — evita precisar de
// coluna extra no Supabase para guardar isso em vendas manuais/editadas.
function roleFromLineId(lineId) {
  const m = /-(cad|conv|full|ren)$/.exec(String(lineId || ''));
  if (!m) return null;
  return {cad:'cadastro', conv:'conversao', full:'completo', ren:'consultor'}[m[1]];
}

// Rótulo do tipo de venda contestada — deriva do sufixo do sale_id (mesma lógica de
// roleFromLineId), pra quem vai analisar a disputa saber se é cadastro/conversão/rematrícula
// sem precisar abrir a venda original.
function disputeTypeLabel(saleId) {
  return {
    cadastro: 'Cadastro', conversao: 'Conversão',
    completo: 'Completo (100%)', consultor: 'Rematrícula / renovação (100%)',
  }[roleFromLineId(saleId)] || 'Não identificado';
}

function dbRowToDispute(r) {
  return {
    _localId: r.local_id,
    saleId: r.sale_id, unit: r.unit, unit_label: r.unit_label,
    originalConsultant: r.original_consultant, claimant: r.claimant,
    reason: r.reason, defense: r.defense, defendedAt: r.defended_at,
    status: r.status, action: r.action, resolution: r.resolution,
    resolvedBy: r.resolved_by, resolvedAt: r.resolved_at,
    createdAt: r.created_at_str, month: r.month, displayId: saleIdFromLine(r.sale_id),
  };
}

function dbRowToDeduction(r) {
  return {
    _localId: r.local_id, consultant: r.consultant, unit: r.unit, unit_label: r.unit_label,
    amount: Number(r.amount), reason: r.reason, month: r.month,
    createdBy: r.created_by, createdAt: r.created_at_str,
  };
}

function dbRowToManual(r) {
  return {
    id: saleIdFromLine(r.id), line_id: r.id, student: r.student, consultant: r.consultant,
    type: r.type, role: roleFromLineId(r.id) || (r.consultant ? 'completo' : null), commission: r.commission, date: r.sale_date,
    contract: r.contract, unit: r.unit, unit_label: r.unit_label,
    month: r.month, _manual: true,
  };
}

// Sync completo: busca as 3 tabelas e atualiza estado local
async function syncFromSupabase() {
  try {
    const [{ data: dbD }, { data: dbU }, { data: dbM }] = await Promise.all([
      db.from('disputes').select('*').eq('month', MONTH),
      db.from('unassigned_sales').select('*').eq('month', MONTH),
      db.from('manual_sales').select('*').eq('month', MONTH),
    ]);
    disputes = (dbD || []).filter(r => unidadePermitida(r.unit)).map(dbRowToDispute);
    const overrides = {
      unassigned: (dbU || []).filter(r => unidadePermitida(r.unit)).map(r => ({ id: r.sale_id, unit: r.unit })),
      added: (dbM || []).filter(r => unidadePermitida(r.unit)).map(dbRowToManual),
    };
    localStorage.setItem(DISPUTES_KEY,  JSON.stringify(disputes));
    localStorage.setItem(OVERRIDES_KEY, JSON.stringify(overrides));
  } catch(e) { console.warn('Supabase sync failed', e); }

  // Descontos por não conformidade — em try separado: se a tabela ainda não existir
  // (migração não rodada), não deve derrubar a sincronização de disputas/vendas acima.
  try {
    const { data: dbDed } = await db.from('deductions').select('*').eq('month', MONTH);
    deductions = (dbDed || []).filter(r => unidadePermitida(r.unit)).map(dbRowToDeduction);
    localStorage.setItem(DEDUCTIONS_KEY, JSON.stringify(deductions));
  } catch(e) { console.warn('Deductions sync failed (rode a migração deductions?)', e); }

  // Configuração de visibilidade — em try separado: se a tabela app_settings ainda não
  // existir, não deve derrubar a sincronização de disputas/vendas acima.
  try {
    const { data: dbS } = await db.from('app_settings').select('*').eq('key', 'sales_visible_to_consultants');
    if (dbS && dbS[0]) {
      salesVisibleToConsultants = dbS[0].value !== 'false';
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({salesVisibleToConsultants}));
    }
  } catch(e) { console.warn('Settings sync failed (rode a migração app_settings?)', e); }
}

async function setSalesVisibility(visible) {
  salesVisibleToConsultants = visible;
  localStorage.setItem(SETTINGS_KEY, JSON.stringify({salesVisibleToConsultants}));
  buildSectionNav();
  renderAdmin();
  if (session.role !== 'coordinator' && activeSection === 'sales' && !visible) {
    switchSection('overview');
  }
  const res = await db.from('app_settings').upsert(
    { key: 'sales_visible_to_consultants', value: visible ? 'true' : 'false' },
    { onConflict: 'key' }
  );
  checkSbResult(res, 'configuração de visibilidade');
}

// Toda escrita no Supabase passa por aqui — se falhar (RLS, coluna incompatível, rede),
// avisa visivelmente em vez de deixar a mudança parecer salva só localmente.
function checkSbResult(res, label) {
  if (res && res.error) {
    console.warn('Supabase write failed:', label, res.error);
    showSyncToast('⚠ Não sincronizou: ' + label);
  }
  return res;
}

// Operações individuais — disputes
async function sbAddDispute(d) {
  const res = await db.from('disputes').insert({
    local_id: d._localId, sale_id: d.saleId, unit: d.unit,
    unit_label: d.unit_label, original_consultant: d.originalConsultant,
    claimant: d.claimant, reason: d.reason, status: d.status,
    created_at_str: d.createdAt, month: d.month,
  });
  return checkSbResult(res, 'contestação');
}
async function sbUpdateDispute(d) {
  const res = await db.from('disputes').update({
    defense: d.defense, defended_at: d.defendedAt,
    status: d.status, action: d.action, resolution: d.resolution,
    resolved_by: d.resolvedBy, resolved_at: d.resolvedAt,
  }).eq('local_id', d._localId);
  return checkSbResult(res, 'disputa');
}

// Operações individuais — vendas sem dono
async function sbUnassignSale(id, unit) {
  const res = await db.from('unassigned_sales').upsert({ sale_id: id, unit, month: MONTH }, { onConflict: 'sale_id,unit' });
  return checkSbResult(res, 'remoção de dono');
}
async function sbReassignSale(id, unit) {
  const res = await db.from('unassigned_sales').delete().eq('sale_id', id).eq('unit', unit);
  return checkSbResult(res, 'reatribuição');
}

// Operações individuais — vendas manuais
async function sbAddManualSale(s) {
  // A coluna "id" no Supabase guarda o line_id (chave única por linha de comissão) —
  // upsert: um "Editar Venda" reenvia o mesmo line_id para sobrescrever a entrada anterior.
  const res = await db.from('manual_sales').upsert({
    id: s.line_id, student: s.student, consultant: s.consultant,
    type: s.type, commission: s.commission, sale_date: s.date,
    contract: s.contract, unit: s.unit, unit_label: s.unit_label, month: s.month,
  }, { onConflict: 'id' });
  return checkSbResult(res, 'venda/edição');
}
async function sbDeleteManualSale(id) {
  const res = await db.from('manual_sales').delete().eq('id', id);
  return checkSbResult(res, 'exclusão');
}

// Operações individuais — descontos por não conformidade
async function sbAddDeduction(d) {
  const res = await db.from('deductions').insert({
    local_id: d._localId, consultant: d.consultant, unit: d.unit, unit_label: d.unit_label,
    amount: d.amount, reason: d.reason, month: d.month,
    created_by: d.createdBy, created_at_str: d.createdAt,
  });
  return checkSbResult(res, 'desconto');
}
async function sbDeleteDeduction(localId) {
  const res = await db.from('deductions').delete().eq('local_id', localId);
  return checkSbResult(res, 'remoção de desconto');
}


// Realtime: qualquer mudança em qualquer tabela re-sincroniza e re-renderiza
function setupRealtime() {
  db.channel('positiva-realtime')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'disputes' }, handleRemoteChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'unassigned_sales' }, handleRemoteChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'manual_sales' }, handleRemoteChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'deductions' }, handleRemoteChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, handleRemoteChange)
    .subscribe();
}

let _realtimeTimer = null;
async function handleRemoteChange() {
  clearTimeout(_realtimeTimer);
  _realtimeTimer = setTimeout(async () => {
    await syncFromSupabase();
    users = await loadUsers();
    destroyCharts();
    buildSectionNav();
    if (session.role !== 'coordinator' && activeSection === 'sales' && !salesVisibleToConsultants) {
      activeSection = 'overview';
    }
    renderSection(activeSection);
    showSyncToast('🔄 Atualizado em tempo real');
  }, 400);
}

function showSyncToast(msg) {
  let el = document.getElementById('sync-badge');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sync-badge';
    el.style.cssText = 'position:fixed;bottom:18px;right:18px;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;z-index:9999;transition:opacity .4s';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.background = msg.includes('🔄') ? 'var(--navy)' : 'var(--success)';
  el.style.color = '#fff';
  el.style.opacity = '1';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.style.opacity = '0'; }, 2500);
}

// ══════════════════════════════════════════════
//  DADOS — vêm do Supabase depois do login (carregarPublicacao); nada fica no HTML
// ══════════════════════════════════════════════
let RAW_SALES  = [];
let RAW_SALES_TODAS = [];   // sem o filtro de unidade do coordenador: a meta da Acqua (v3) junta Laranjeiras + República
let MONTH      = '';
let UNIT_KEYS  = [];
let UNIT_LABELS= {};
let ALL_MONTHS = [];
let DEFAULT_CONSULTANT = '';
// Coordenador de unidade: só as unidades marcadas no perfil (null = todas — super admin e consultores).
let UNIDADES_PERMITIDAS = null;
const unidadePermitida = (u) => !UNIDADES_PERMITIDAS || UNIDADES_PERMITIDAS.includes(u);

// Lê a publicação do mês pedido (?mes=Outubro/2026) ou a mais recente, e as vendas dela. Desde 17/11/2026 o mês atual
// é publicado sozinho toda madrugada pela EVO (função evo-bonus); os meses anteriores continuam disponíveis no seletor.
let PUBLICACOES = [];
async function carregarPublicacao() {
  const { data: pubs, error } = await db.from('bonus_publicacoes').select('*').order('publicado_em', { ascending: false });
  if (error || !pubs || !pubs.length) return false;
  const pedido = new URLSearchParams(location.search).get('mes');
  const pub = pubs.find(p => p.mes === pedido) || pubs[0];
  PUBLICACOES = pubs.map(p => ({ mes: p.mes, em: p.publicado_em }));
  const vendas = [];
  for (let de = 0; ; de += 1000) {
    const { data, error: e } = await db.from('vendas').select('dados').eq('mes', pub.mes).order('ordem').range(de, de + 999);
    if (e) return false;
    vendas.push(...data.map(r => r.dados));
    if (data.length < 1000) break;
  }
  RAW_SALES = vendas.filter(v => unidadePermitida(v.unit));
  RAW_SALES_TODAS = vendas;
  MONTH = pub.mes;
  UNIT_KEYS = pub.unidades.filter(unidadePermitida);
  UNIT_LABELS = pub.rotulos;
  ALL_MONTHS = pub.meses;
  DEFAULT_CONSULTANT = pub.default_consultant;
  OVERRIDES_KEY = 'positiva_overrides_' + MONTH.replace('/','_');
  activeMonth = ALL_MONTHS[ALL_MONTHS.length - 1] || MONTH;
  return true;
}

// Retorna "PrimeiroNome Sobrenome" para diferenciar homônimos
function shortName(fullName) {
  if (!fullName) return '—';
  if (fullName === DEFAULT_CONSULTANT) return DEFAULT_CONSULTANT;   // sempre por extenso, maiúsculo
  const parts = fullName.trim().split(/\s+/);
  if (parts.length <= 2) return parts.map(p => p[0] + p.slice(1).toLowerCase()).join(' ');
  const first = parts[0][0] + parts[0].slice(1).toLowerCase();
  const last  = parts[parts.length - 1][0] + parts[parts.length - 1].slice(1).toLowerCase();
  return first + ' ' + last;
}

// ══════════════════════════════════════════════
//  FILTER SALES
// ══════════════════════════════════════════════
function getFilteredSales(monthOverride, opts) {
  // allUnits: base da meta — inclui a outra unidade da Acqua mesmo para o coordenador de uma unidade só
  // (o que aparece na tela continua filtrado pelas unidades dele: os cartões e tabelas filtram por grupo/unidade depois)
  let sales = (opts && opts.allUnits ? RAW_SALES_TODAS.filter(s => unidadePermitida(s.unit) || ACQUA_UNITS.includes(s.unit)) : RAW_SALES).map(s => ({...s}));
  const overrides = loadOverrides();
  // Apply dispute transfers
  disputes.filter(d => d.status === 'resolved' && d.action === 'transfer').forEach(d => {
    const s = sales.find(x => x.line_id === d.saleId && x.unit === d.unit);
    if (s) s.consultant = d.claimant;
  });
  // Apply unassignments
  overrides.unassigned.forEach(({id, unit}) => {
    const s = sales.find(x => x.line_id === id && x.unit === unit);
    if (s) s.consultant = '';
  });
  // Vendas manuais/editadas: quando o id coincide com uma linha do relatório, ela é
  // substituída (edição); ids novos são inclusões.
  const overrideIds = new Set(overrides.added.map(s => s.line_id));
  sales = sales.filter(s => !overrideIds.has(s.line_id));
  sales = [...sales, ...overrides.added];

  const month = monthOverride || activeMonth;
  sales = sales.filter(s => s.month === month);
  if (activeUnit && !(opts && opts.allUnits)) sales = sales.filter(s => s.unit === activeUnit);
  // Vendas sem dono são excluídas de todos os cálculos e visões (exceto tabela do coordenador)
  if (!(opts && opts.includeUnassigned)) {
    sales = sales.filter(s => !!s.consultant);
  }
  return sales;
}

function salesForConsultant(name, sales) {
  return sales.filter(s => s.consultant === name);
}

function getConsultants(sales) {
  return [...new Set(sales.map(s => s.consultant))].filter(Boolean).sort();
}

function calcCommission(sales) {
  return Math.round(sales.reduce((a, s) => a + s.commission, 0) * 100) / 100;
}

// Descontos por não conformidade (Seção 6/7 da política) — lançados à parte, não
// ligados a uma venda específica, por isso não entram em `sales`/`s.commission`.
// Reduzem só a comissão individual do consultor; o bônus de equipe não é afetado.
function deductionTotal(consultant, unit, monthOverride) {
  const m = monthOverride || activeMonth;
  return deductions
    .filter(d => d.consultant === consultant && d.month === m && (!unit || d.unit === unit))
    .reduce((a, d) => a + Number(d.amount), 0);
}
function allDeductionsTotal(unit, monthOverride) {
  const m = monthOverride || activeMonth;
  return deductions
    .filter(d => d.month === m && (!unit || d.unit === unit))
    .reduce((a, d) => a + Number(d.amount), 0);
}
// Total líquido de uma pessoa: soma das vendas dela (já com o multiplicador da
// semana aplicado, se `sales` vier de pricedSales) menos os descontos do mês/unidade.
function personTotal(name, sales, unit, monthOverride) {
  const gross = calcCommission(salesForConsultant(name, sales));
  return Math.round((gross - deductionTotal(name, unit, monthOverride)) * 100) / 100;
}

function uniqueTypeCount(sales, type, source) {
  return new Set(sales.filter(s=>s.type===type && (!source || s.source===source)).map(s=>s.id)).size;
}

function uniqueSaleCount(sales) {
  return new Set(sales.map(s=>s.type+':'+s.id)).size;
}

// Cadastro e conversão são contribuições distintas de uma mesma matrícula nova — sem
// separar por role, "Novos" mistura quem cadastrou com quem converteu e não dá pra saber
// a contribuição real de cada consultor. Rematrícula é sempre 100% de uma pessoa só.
// "Renovação" (source === 'filtro') é separada de "Rematrícula" (source === 'relatorio')
// de propósito: são renovações que o relatório oficial de rematrícula não capturou,
// reconciliadas a partir do FiltroClientes — o coordenador precisa saber quem são.
function roleBreakdown(sales) {
  return {
    cad:  sales.filter(s=>s.role==='cadastro').length,
    conv: sales.filter(s=>s.role==='conversao').length,
    full: sales.filter(s=>s.role==='completo').length,
    ren:  sales.filter(s=>s.type==='renewal' && s.source!=='filtro').length,
    renF: sales.filter(s=>s.type==='renewal' && s.source==='filtro').length,
  };
}
function roleBreakdownText(b) {
  const parts = [];
  if (b.cad)   parts.push(`${b.cad} cadastro${b.cad!==1?'s':''}`);
  if (b.conv)  parts.push(`${b.conv} convers${b.conv!==1?'ões':'ão'}`);
  if (b.full)  parts.push(`${b.full} venda${b.full!==1?'s':''} completa${b.full!==1?'s':''}`);
  if (b.ren)   parts.push(`${b.ren} rematrícula${b.ren!==1?'s':''}`);
  if (b.renF)  parts.push(`${b.renF} renovaç${b.renF!==1?'ões':'ão'}`);
  return parts.length ? parts.join(' · ') : 'Sem vendas no período';
}

function money(v) {
  v = Math.round(v * 100) / 100;
  return Number.isInteger(v) ? String(v) : v.toFixed(2).replace('.', ',');
}

function roleLabel(s) {
  if (s.extra_clt) { const e = equipeCfg(s.unit, s.month), f = (e?.renda_extra?.faixas || []).map(x => x.pct);
    return e && f.length ? `${e.renda_extra.nome || 'Renda extra'} (${Math.min(...f)}% a ${Math.max(...f)}%)` : 'Renda extra CLT (20% a 35%)'; }
  if (s.role === 'consultor') return s.kind === 'upgrade' ? 'Upgrade (100%)' : s.source === 'filtro' ? 'Renovação (100%)' : 'Rematrícula (100%)';
  const [cad, conv] = divisaoNova(s.unit, s.month);
  return {cadastro:`Cadastro (${cad}%)`, conversao:`Conversão (${conv}%)`, completo:'Completo (100%)'}[s.role] || '';
}

// ══════════════════════════════════════════════
//  META SEMANAL (política 2026)
// ══════════════════════════════════════════════
// A semana é sempre segunda a domingo. O mês é sempre dividido em exatamente 4
// semanas: dias soltos do início do mês entram na 1ª semana, dias soltos do fim
// entram na 4ª — as semanas 2 e 3 são sempre semanas cheias.
const MONTH_NAMES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                         'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// Contestação só até o dia 10 (pedido de 18/11/2026): do dia 1º ao 10 de cada mês, as consultoras veem a lista de vendas
// do MÊS QUE FECHOU e podem contestar; depois do dia 10, a aba "Vendas" some para elas e o banco recusa contestação nova
// (gatilho disputes_no_prazo). A meta semanal continua sempre visível. Coordenação vê e contesta sempre; o liga/desliga
// das Configurações virou exceção ("liberar fora do prazo").
function hojeSPBonus() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date()); }
function mesDaJanela(hoje = hojeSPBonus()) {   // rótulo do mês aberto para contestação hoje, ou null depois do dia 10
  const ano = +hoje.slice(0, 4), mes = +hoje.slice(5, 7), dia = +hoje.slice(8, 10);
  if (dia > 10) return null;
  return `${MONTH_NAMES_PT[mes === 1 ? 11 : mes - 2]}/${mes === 1 ? ano - 1 : ano}`;
}
function contestacaoAberta(mes) {
  return session.role === 'coordinator' || salesVisibleToConsultants || mes === mesDaJanela();
}
function avisoContestacao() {
  const el = document.getElementById('aviso-contestacao');
  if (!el) return;
  const janela = mesDaJanela();
  if (session.role === 'coordinator' || !janela) { el.innerHTML = ''; return; }
  const hoje = hojeSPBonus();
  const prazo = `10/${hoje.slice(5, 7)}`;
  const caixa = 'margin:0 0 14px;padding:12px 16px;border-radius:12px;background:#FFF7E6;border:1px solid #F5D9A8;font-size:14px;line-height:1.45';
  if (MONTH === janela) {
    el.innerHTML = `<div style="${caixa}">📣 <b>Até ${prazo}</b> você pode conferir as vendas de <b>${janela}</b> na aba <b>Vendas</b> e contestar o que estiver errado. Depois disso não dá mais para contestar.</div>`;
  } else if (PUBLICACOES.some(p => p.mes === janela)) {
    el.innerHTML = `<div style="${caixa}">📣 <b>Até ${prazo}</b> dá para conferir e contestar as vendas de <b>${janela}</b>. <a href="?mes=${encodeURIComponent(janela)}" style="font-weight:800">Abrir ${janela} →</a></div>`;
  } else el.innerHTML = '';
}

function parseBRDate(str) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})/.exec(String(str||''));
  if (!m) return null;
  return new Date(parseInt(m[3],10), parseInt(m[2],10)-1, parseInt(m[1],10));
}

function parseMonthLabel(label) {
  const parts = String(label||'').split('/');
  if (parts.length !== 2) return null;
  const idx = MONTH_NAMES_PT.indexOf(parts[0]);
  const year = parseInt(parts[1], 10);
  if (idx < 0 || !year) return null;
  return {month: idx, year};
}

// Política v2: vale para vendas de setembro/2026 em diante (meses anteriores mantêm as
// regras antigas, pra não recalcular retroativamente o que já foi pago).
function policyV2(label) {
  const p = parseMonthLabel(label);
  return !!p && (p.year * 100 + p.month + 1) >= 202609;
}

// Política v3 (aprovada nas unidades em 24/11/2026; vendas de dezembro/2026 em diante): Laranjeiras + República são UMA
// equipe ("Acqua", 5 consultoras atendendo misturado). A meta vem das saídas da EVO (função bonus_regua): Básico = média das
// saídas dos 3 meses anteriores ÷ consultoras ÷ 4; Entrada = Básico − 1 (30%), Básico (60%), Meta real = Básico + 1 (100%).
// Bônus de equipe: R$ 200 com Básico × consultoras × 4 contratos, R$ 300 com Meta real × consultoras × 4 — só se a equipe
// vender pelo menos o número de saídas do mês. Bônus da Central (função bonus_central): +5% (Bom) / +20% (Ótimo) da comissão
// da semana, com as travas: Básico na semana + mínimo da Central em 4 de 5 dias + equipe ≥ saídas no mês. O Club não muda.
const ACQUA_UNITS = ['laranjeiras', 'republica'];
const GRUPO_ACQUA = 'acqua';
const ROTULO_ACQUA = 'Acqua (Laranjeiras + República)';
function policyV3(label) {
  const p = parseMonthLabel(label);
  return !!p && (p.year * 100 + p.month + 1) >= 202612;
}
// Club — Política de Bonificações (documento da gestão; vale para novembro/2026 inteiro, pedido de 25/11/2026): meta semanal
// 4/7/10 contratos (50/70/100%), cada Black vale meio contrato na meta, matrícula nova 50/50, renovação/troca/upgrade pagam mas
// não contam, bônus de equipe R$ 100–500 (49/61/71/81/91 vendas) e prêmio mensal em vale-compras pelas semanas em Super meta.
function policyClubV3(label) {
  const p = parseMonthLabel(label);
  return !!p && (p.year * 100 + p.month + 1) >= 202611;
}
const ehClubV3 = (unit, label) => unit === 'club' && policyClubV3(label || activeMonth);
const CLUB_V3_TIERS = [[10, 1.0], [7, 0.7], [4, 0.5], [0, 0]];
const CLUB_V3_TIER_NAMES = [[10, 'Super meta'], [7, 'Meta real'], [4, 'Básico'], [0, 'Abaixo do básico']];
const CLUB_V3_TEAM = { steps: [49, 61, 71, 81, 91], amounts: [100, 200, 300, 400, 500] };
// Prêmio mensal (vale-compras do Showroom Dus2, pago à parte): R$ 200 / 300 / 450 com 2 / 3 / 4 semanas em Super meta.
// pisoTodas: além disso, nenhuma semana pode ficar abaixo do Básico ("bater todas as metas semanais").
const PREMIO_CLUB = { faixas: [[4, 450], [3, 300], [2, 200]], pisoTodas: true };
// Renda extra do plano CLT Laranjeiras (Club, fora da carga horária): o contrato gera o bônus de um Seja Positiva e paga só esta
// porcentagem, pela quantidade de contratos CLT da pessoa na semana; não conta para meta, equipe nem prêmio
const RENDA_EXTRA_CLT = [[10, 0.35], [7, 0.30], [4, 0.25], [1, 0.20]];
const pctRendaExtra = n => (RENDA_EXTRA_CLT.find(([min]) => n >= min) || [0, 0])[1];
// Peso de uma venda na meta: Black do Club (nov/2026+) vale meio contrato — "a cada 2 vale 1"
const pesoMeta = s => Number(s.goal_weight) || 1;
const somaMeta = sales => Math.floor(sales.reduce((a, s) => a + pesoMeta(s), 0) + 1e-9);
// Parte do cadastro / da conversão na matrícula nova
const divisaoNova = (unit, label) => { const e = equipeCfg(unit, label); return e ? BonusMotor.divisao(e) : ehClubV3(unit, label) ? [50, 50] : [70, 30]; };

// ── Bônus configurável por academia (27/11/2026) ──
// As regras do mês vêm da configuração da academia (tabela bonus_config, lida por bonus_config_ler): equipes (unidades que
// formam uma meta), faixas semanais, divisão, bônus de equipe, prêmio, renda extra e bônus da Central. Mês sem versão
// (antes de novembro/2026 na Positiva) ou configuração que não carregou: as regras antigas abaixo, sem mudança.
const BONUS_CONFIG = [];
function cfgDoMes(label) {
  return BONUS_CONFIG.length && window.BonusMotor ? BonusMotor.versaoDoMes(BONUS_CONFIG, label || activeMonth) : null;
}
// equipe pelo id do grupo ('acqua', 'club') ou pela unidade
function equipeCfg(g, label) {
  const v = cfgDoMes(label);
  return v ? (BonusMotor.equipePorId(v, g) || BonusMotor.equipeDaUnidade(v, g)) : null;
}
const usaRegua = (e) => !!e && (e.meta?.modo === 'saidas' || e.bonus_equipe?.modo === 'regua' || !!e.bonus_equipe?.trava_saidas);
const temCentral = (g, label) => { const e = equipeCfg(g, label); return e ? !!e.central : cfgDoMes(label) ? false : g === GRUPO_ACQUA; };
const temPremio = (g, label) => { const e = equipeCfg(g, label); return e ? !!e.premio : ehClubV3(g, label); };
async function carregarConfigBonus() {
  try {
    // o motor vem de um módulo: espera no máximo 8 s; sem ele, segue com as regras antigas (o Bônus abre do mesmo jeito)
    const pronto = await Promise.race([
      new Promise(res => window.BonusMotor ? res(true) : window.addEventListener('bonus-motor', () => res(true), { once: true })),
      new Promise(res => setTimeout(() => res(false), 8000))]);
    if (!pronto) { console.warn('Motor do Bônus não carregou: regras antigas'); return; }
    // a tabela de planos só interessa a quem edita (coordenação); a consultora recebe só as regras
    const { data, error } = await db.rpc('bonus_config_ler', { p_planos: session.role === 'coordinator' });
    if (!error && Array.isArray(data)) BONUS_CONFIG.push(...data);
  } catch (e) { console.warn('Configuração do Bônus não carregou (fica a regra antiga)', e); }
}

const REGUAS = {};    // rótulo do mês → régua da Acqua (bonus_regua)
const CENTRAL = {};   // rótulo do mês → pontos da Central por consultora e semana (bonus_central)
function mesISO(label) {
  const p = parseMonthLabel(label);
  return p ? `${p.year}-${String(p.month + 1).padStart(2, '0')}-01` : null;
}
function reguaDe(label) {
  return REGUAS[label || activeMonth] || { entrada: 2, basico: 3, meta_real: 4, equipe_200: 60, equipe_300: 80, consultoras: 5,
    saidas_base: 52, saidas_mes: null, regua_central: 33 };
}
function grupoMeta(unit, label) {
  const v = cfgDoMes(label);
  if (v) return BonusMotor.equipeDaUnidade(v, unit)?.id || unit;
  return policyV3(label || activeMonth) && ACQUA_UNITS.includes(unit) ? GRUPO_ACQUA : unit;
}
function unidadesDoGrupo(g) {
  const e = cfgDoMes() && BonusMotor.equipePorId(cfgDoMes(), g);
  if (e) return e.unidades;
  return g === GRUPO_ACQUA ? ACQUA_UNITS : [g];
}
function noGrupo(s, g) { return unidadesDoGrupo(g).includes(s.unit); }
function rotuloGrupo(g) {
  const e = cfgDoMes() && BonusMotor.equipePorId(cfgDoMes(), g);
  if (e) return e.unidades.length > 1 ? e.nome : (UNIT_LABELS[g] || e.nome || g);
  return g === GRUPO_ACQUA ? ROTULO_ACQUA : (UNIT_LABELS[g] || g);
}
function gruposDe(units, label) { return [...new Set(units.map(u => grupoMeta(u, label)))]; }
async function carregarReguas() {
  const meses = [...new Set([...ALL_MONTHS, MONTH])].filter(m => cfgDoMes(m) ? (cfgDoMes(m).equipes || []).some(usaRegua) : policyV3(m));
  if (!meses.length && session.role === 'coordinator') meses.push('Dezembro/2026');   // Configurações mostram a régua que vem
  await Promise.all(meses.map(async m => {
    try {
      const [r, c] = await Promise.all([db.rpc('bonus_regua', { p_mes: mesISO(m) }), db.rpc('bonus_central', { p_mes: mesISO(m) })]);
      if (r.data) REGUAS[m] = r.data;
      if (c.data) CENTRAL[m] = c.data;
    } catch (e) { console.warn('Régua/Central não carregou', m, e); }
  }));
}

// Uma venda vale como unidade da meta semanal quando é do dono do cadastro (cadastro,
// rematrícula, renovação, venda completa) E o Python não marcou `counts_goal: false`
// (v2: renovação mês 13 e upgrade continuam pagando, mas não entram na contagem).
function countsToGoal(s) {
  return (s.role === 'cadastro' || s.role === 'consultor' || s.role === 'completo') && s.counts_goal !== false;
}

// Devolve os 4 intervalos [início,fim] (Date) da semana daquele mês, ou null se o
// mês não for reconhecido (rótulo fora do padrão "Mês/Ano").
function weekBoundsForMonth(label) {
  const parsed = parseMonthLabel(label);
  if (!parsed) return null;
  const {month, year} = parsed;
  const first = new Date(year, month, 1);
  const last  = new Date(year, month + 1, 0);
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
  const mondays = [];
  for (let d = new Date(first); d <= last; d = addDays(d, 1)) {
    if (d.getDay() === 1) mondays.push(new Date(d));
  }
  if (mondays.length < 4) return null;   // não deveria acontecer (todo mês de 28+ dias tem 4 segundas)
  const [, m2, m3, m4] = mondays;
  return [
    {start: first, end: addDays(m2, -1)},
    {start: m2,    end: addDays(m3, -1)},
    {start: m3,    end: addDays(m4, -1)},
    {start: m4,    end: last},
  ];
}

function weekIndexForSale(sale) {
  const bounds = weekBoundsForMonth(sale.month);
  const d = parseBRDate(sale.date);
  if (!bounds || !d) return null;
  for (let i = 0; i < bounds.length; i++) {
    if (d >= bounds[i].start && d <= bounds[i].end) return i + 1;
  }
  return null;
}

// [mínimo de contratos na semana, percentual] — ordenado do maior pro menor.
const WEEKLY_TIERS = {
  club:        [[12, 1.0], [9, 0.7], [6, 0.5], [0, 0]],
  laranjeiras: [[4, 1.0], [3, 0.7], [2, 0.5], [0, 0]],
  republica:   [[4, 1.0], [3, 0.7], [2, 0.5], [0, 0]],
};
const WEEK_TIER_NAMES = [[12,'Super meta'],[9,'Meta real'],[6,'Básico'],[0,'Abaixo do básico']]; // club
const WEEK_TIER_NAMES_ACQUA = [[4,'Super meta'],[3,'Meta real'],[2,'Básico'],[0,'Abaixo do básico']];

const ehAcquaV3 = (unit, label) => unit === GRUPO_ACQUA || (ACQUA_UNITS.includes(unit) && policyV3(label || activeMonth));
function weeklyTiers(unit, label) {
  const e = equipeCfg(unit, label);
  if (e) return BonusMotor.faixasSemana(e, reguaDe(label)).map(([min, pct]) => [min, pct]);
  if (ehAcquaV3(unit, label)) {
    const r = reguaDe(label);
    return [[r.meta_real, 1.0], [r.basico, 0.6], [r.entrada, 0.3], [0, 0]];
  }
  if (ehClubV3(unit, label)) return CLUB_V3_TIERS;
  return WEEKLY_TIERS[unit] || WEEKLY_TIERS.club;
}
function weekTierNames(unit, label) {
  const e = equipeCfg(unit, label);
  if (e) return BonusMotor.faixasSemana(e, reguaDe(label)).map(([min, , nome]) => [min, nome]);
  if (ehAcquaV3(unit, label)) {
    const r = reguaDe(label);
    return [[r.meta_real, 'Meta real'], [r.basico, 'Básico'], [r.entrada, 'Entrada'], [0, 'Abaixo da entrada']];
  }
  if (ehClubV3(unit, label)) return CLUB_V3_TIER_NAMES;
  return unit === 'club' ? WEEK_TIER_NAMES : WEEK_TIER_NAMES_ACQUA;
}

function weeklyTierPct(unit, count, label) {
  for (const [min, pct] of weeklyTiers(unit, label)) { if (count >= min) return pct; }
  return 0;
}
function weekTierLabel(unit, count, label) {
  for (const [min, name] of weekTierNames(unit, label)) { if (count >= min) return name; }
  return 'Abaixo do básico';
}
// Quantos contratos faltam pra bater a PRÓXIMA faixa (0 = já está na faixa máxima).
function weekTierNextGoal(unit, count, label) {
  const asc = weeklyTiers(unit, label).slice().reverse();
  for (const [min] of asc) { if (count < min) return min - count; }
  return 0;
}

// Conta, por consultor × unidade × semana, quantos contratos "de meta" (cadastro,
// rematrícula/dono-do-cadastro, ou venda completa manual) a pessoa teve — e converte
// isso no percentual da faixa. A chave não inclui o papel (role) de propósito: o
// percentual encontrado vale pra TUDO que é da pessoa naquela semana, inclusive a
// conversão que ela ganhou fechando venda de outra pessoa (política confirmada).
function computeWeeklyBreakdown(sales) {
  const counts = {};
  // `seenKeys` registra TODA combinação consultor+unidade+semana que teve QUALQUER venda
  // (inclusive só conversão, sem nenhum cadastro/renovação) — sem isso, uma pessoa que só
  // converteu naquela semana (0 contratos de meta) nunca teria uma chave em `counts`, e o
  // saleWeekPct() caía no fallback de "chave não encontrada" pagando 100% por engano em vez
  // de aplicar a faixa 0% de quem não cadastrou ninguém.
  // v3: na Acqua a chave é o grupo (Laranjeiras + República juntas), não a unidade.
  const seenKeys = new Map();
  const cltIds = {};   // renda extra CLT: contratos CLT distintos da pessoa na semana
  sales.forEach(s => {
    if (!s.consultant) return;
    const wk = weekIndexForSale(s);
    if (!wk) return;
    const g = grupoMeta(s.unit, s.month);
    const key = s.consultant + '|' + g + '|' + wk;
    seenKeys.set(key, {g, month: s.month});
    if (s.extra_clt) (cltIds[key] = cltIds[key] || new Set()).add(s.type + ':' + s.id);
    if (countsToGoal(s)) {
      counts[key] = (counts[key] || 0) + pesoMeta(s);   // Black do Club v3 = meio contrato
    }
  });
  Object.keys(counts).forEach(k => { counts[k] = Math.floor(counts[k] + 1e-9); });
  const pctByKey = {};
  seenKeys.forEach(({g, month}, key) => {
    pctByKey[key] = weeklyTierPct(g, counts[key] || 0, month);
  });
  const cltPctByKey = {};
  Object.keys(cltIds).forEach(k => {
    const { g, month } = seenKeys.get(k), e = equipeCfg(g, month);
    cltPctByKey[k] = e ? BonusMotor.pctRendaExtra(e, cltIds[k].size) : pctRendaExtra(cltIds[k].size);
  });
  return {counts, pctByKey, cltPctByKey};
}

function saleWeekPct(sale, breakdown) {
  if (!sale.consultant) return 1;           // sem dono: não participa de meta nenhuma, mantém como está
  const wk = weekIndexForSale(sale);
  if (!wk) return 1;                        // data inválida/fora do mês: não penaliza, paga cheio
  const key = sale.consultant + '|' + grupoMeta(sale.unit, sale.month) + '|' + wk;
  if (sale.extra_clt) return breakdown.cltPctByKey[key] || 0;   // renda extra CLT: 20% a 35% do bônus de Seja
  return breakdown.pctByKey[key] !== undefined ? breakdown.pctByKey[key] : 1;
}

// Aplica o multiplicador da meta semanal em cima da comissão-base de cada venda.
// IMPORTANTE: a base do cálculo (`breakdown`) sempre vem do conjunto COMPLETO de
// vendas com dono do mês/unidade ativos — nunca do subconjunto já filtrado (busca,
// tipo, consultor) que às vezes é o que efetivamente será exibido — senão filtrar a
// tabela de vendas mudaria a meta batida de todo mundo.
function pricedSales(sales, monthOverride) {
  // allUnits: na Acqua v3 a meta junta as duas unidades — a aba de uma unidade não pode mudar a faixa de ninguém
  const base = getFilteredSales(monthOverride, {includeUnassigned: false, allUnits: true});
  const breakdown = computeWeeklyBreakdown(base);
  return sales.map(s => {
    const pct = saleWeekPct(s, breakdown);
    return {...s, commission: Math.round(s.commission * pct * 100) / 100, _base_commission: s.commission, _week_pct: pct};
  });
}

// ══════════════════════════════════════════════
//  BÔNUS DE EQUIPE MENSAL (política 2026)
// ══════════════════════════════════════════════
function teamBonusTotal(unit, count) {
  if (unit === 'laranjeiras') {
    if (count >= 64) return 1300 + 30*(count-63);
    if (count >= 55) return 1000;
    if (count >= 47) return 700;
    if (count >= 38) return 400;
    return 0;
  }
  if (unit === 'republica') {
    if (count >= 42) return 900 + 30*(count-41);
    if (count >= 35) return 700;
    if (count >= 28) return 500;
    if (count >= 22) return 250;
    return 0;
  }
  if (unit === 'club') {
    if (count >= 140) return 2000 + 60*(count-139);
    if (count >= 120) return 1600;
    if (count >= 100) return 1200;
    if (count >= 80) return 600;
    return 0;
  }
  return 0;
}
const TEAM_BONUS_STEPS = {laranjeiras:[38,47,55,64], republica:[22,28,35,42], club:[80,100,120,140]};
function teamBonusNextGoal(unit, count) {
  const steps = TEAM_BONUS_STEPS[unit] || TEAM_BONUS_STEPS.club;
  for (const step of steps) { if (count < step) return step - count; }
  return 0;   // já na faixa máxima (segue rendendo por contrato excedente)
}

// Reparte o bônus de equipe: quem cadastra (+ rematrícula/dono-do-cadastro) fica com
// uma fatia proporcional às próprias vendas; quem converte divide o resto em partes
// iguais. Generaliza os exemplos do documento (que citam nomes fixos) pra qualquer
// número de pessoas em cada papel.
// v2 (setembro/2026+): valor FIXO por pessoa (R$ 200 / 300 / 500), igual em todas as
// unidades, pra todo mundo que vendeu na unidade no mês (cadastro OU conversão). Só
// contam vendas novas e rematrículas — renovação, troca de contrato e upgrade ficam fora.
const TEAM_BONUS_V2_STEPS   = {laranjeiras:[47,55,64], republica:[24,28,32], club:[72,84,98]};
const TEAM_BONUS_V2_AMOUNTS = [200, 300, 500];
function teamBonusPerPersonV2(unit, count) {
  const steps = TEAM_BONUS_V2_STEPS[unit] || TEAM_BONUS_V2_STEPS.club;
  let v = 0;
  steps.forEach((min, i) => { if (count >= min) v = TEAM_BONUS_V2_AMOUNTS[i]; });
  return v;
}
function teamBonusNextGoalV2(unit, count) {
  const steps = TEAM_BONUS_V2_STEPS[unit] || TEAM_BONUS_V2_STEPS.club;
  for (const step of steps) { if (count < step) return step - count; }
  return 0;   // faixa máxima (R$ 500)
}

// v3 (Acqua, dez/2026+): uma conta só para Laranjeiras + República. "Trava da equipe" = a equipe fechou pelo menos tantos
// contratos quanto as saídas do mês (lidas na EVO e lançadas em Configurações). Sem as saídas lançadas, fica "pendente".
function teamBonusAcquaV3(sales, month) {
  const m = month || activeMonth, r = reguaDe(m);
  const groupSales = sales.filter(s => ACQUA_UNITS.includes(s.unit) && s.consultant);
  const count = new Set(groupSales.filter(s => s.counts_goal !== false).map(s => s.unit + ':' + s.type + ':' + s.id)).size;
  const previsto = count >= r.equipe_300 ? 300 : count >= r.equipe_200 ? 200 : 0;
  const saidas = r.saidas_mes;
  const trava = saidas == null ? 'pendente' : count >= saidas ? 'aberta' : 'fechada';
  const perPerson = trava === 'aberta' ? previsto : 0;
  // só as consultoras da Acqua recebem (coordenação e quem vendeu de passagem não entram) — lista vem da régua
  const nomes = new Set(r.nomes || []);
  const people = [...new Set(groupSales.map(s => s.consultant))].filter(n => n !== DEFAULT_CONSULTANT && (!nomes.size || nomes.has(n)));
  const byPerson = {};
  if (perPerson > 0) people.forEach(n => { byPerson[n] = perPerson; });
  const nextGoal = count < r.equipe_200 ? r.equipe_200 - count : count < r.equipe_300 ? r.equipe_300 - count : 0;
  return {v2: true, v3: true, count, perPerson, previsto, people: people.length, total: perPerson * people.length,
          nextGoal, byPerson, trava, saidas, saidasBase: r.saidas_base, regua: r};
}

// Bônus da Central da semana (v3): +5% (Bom) / +20% (Ótimo) da comissão que ela ganhou na semana, nas duas unidades.
// Devolve { nivel, pct, valor, motivo, pontos } — valor 0 quando alguma trava fecha (o motivo diz qual).
const NIVEL_CENTRAL = { otimo: { nome: 'Ótimo', pct: 0.20 }, bom: { nome: 'Bom', pct: 0.05 }, normal: { nome: 'Normal', pct: 0 } };
function centralDaSemana(name, wk, metaCount, earned, month, g = GRUPO_ACQUA) {
  const m = month || activeMonth;
  const eq = equipeCfg(g, m);
  if (eq ? !eq.central : cfgDoMes(m) || !policyV3(m)) return null;
  const dadosC = CENTRAL[m];
  const c = dadosC && (dadosC.consultoras || []).find(x => x.nome_bonus === name);
  if (!c) return { nivel: null, pct: 0, valor: 0, motivo: 'sem pontos da Central', pontos: null };
  const s = c.semanas.find(x => x.n === wk) || {};
  const n = eq ? BonusMotor.nivelCentral(eq, s.nivel) : (NIVEL_CENTRAL[s.nivel] || NIVEL_CENTRAL.normal);
  const r = reguaDe(m);
  const equipe = eq ? computeTeamBonus(getFilteredSales(m, {includeUnassigned: false, allUnits: true}), g, m)
                    : teamBonusAcquaV3(getFilteredSales(m, {includeUnassigned: false, allUnits: true}), m);
  let motivo = '';
  if (!n.pct) motivo = `${money(s.total ?? 0)} pontos (Bom a partir de ${money(dadosC.bom)})`;
  else if (metaCount < r.basico) motivo = `faltou o Básico (${r.basico} contratos) na semana`;
  else if (!s.trava_minimo) motivo = `mínimo da Central em ${s.dias_ok} de ${s.dias_validos} dias`;
  else if (equipe.trava === 'fechada') motivo = `a equipe fechou ${equipe.count} contratos e saíram ${equipe.saidas} alunos`;
  else if (equipe.trava === 'pendente') motivo = 'aguardando as saídas do mês para liberar';
  const libera = n.pct > 0 && !motivo;
  const previsto = Math.round(earned * n.pct * 100) / 100;
  return { nivel: n.nome, pct: n.pct, valor: libera ? previsto : 0, previsto, motivo, pontos: s.total ?? 0, semana: s,
           pendente: n.pct > 0 && equipe.trava === 'pendente' && metaCount >= r.basico && s.trava_minimo };
}

function computeTeamBonus(sales, unit, month) {
  const e = equipeCfg(unit, month);
  if (e) {
    const b = BonusMotor.bonusEquipe(e, sales, { regua: usaRegua(e) ? reguaDe(month) : null, semDona: DEFAULT_CONSULTANT });
    return { ...b, v3: !!e.bonus_equipe?.trava_saidas, clubV3: e.bonus_equipe?.modo === 'fixo' && !e.bonus_equipe?.trava_saidas && !!e.premio };
  }
  if (unit === GRUPO_ACQUA) return teamBonusAcquaV3(sales, month);
  const unitSales = sales.filter(s => s.unit === unit && s.consultant);
  if (ehClubV3(unit, month)) {
    // só matrícula nova e rematrícula contam (Black = meio); recebe quem teve cadastro ou conversão (ou rematrícula) no mês
    const metaLines = unitSales.filter(s => s.counts_goal !== false);
    const porVenda = new Map();
    metaLines.forEach(s => porVenda.set(s.type + ':' + s.id, pesoMeta(s)));
    const count = Math.floor([...porVenda.values()].reduce((a, b) => a + b, 0) + 1e-9);
    let perPerson = 0;
    CLUB_V3_TEAM.steps.forEach((min, i) => { if (count >= min) perPerson = CLUB_V3_TEAM.amounts[i]; });
    const people = [...new Set(metaLines.map(s => s.consultant))].filter(n => n !== DEFAULT_CONSULTANT);
    const byPerson = {};
    if (perPerson > 0) people.forEach(n => { byPerson[n] = perPerson; });
    const prox = CLUB_V3_TEAM.steps.find(st => count < st);
    return {v2: true, clubV3: true, count, perPerson, people: people.length, total: perPerson * people.length,
            nextGoal: prox ? prox - count : 0, byPerson};
  }
  if (policyV2(month || activeMonth)) {
    const count = uniqueSaleCount(unitSales.filter(s => s.counts_goal !== false));
    const perPerson = teamBonusPerPersonV2(unit, count);
    // O consultor padrão (SUPORTEEVO - IA) é só um marcador de "sem dono", não uma pessoa.
    const people = [...new Set(unitSales.map(s => s.consultant))].filter(n => n !== DEFAULT_CONSULTANT);
    const byPerson = {};
    if (perPerson > 0) people.forEach(n => { byPerson[n] = perPerson; });
    return {v2: true, count, perPerson, people: people.length, total: perPerson * people.length,
            nextGoal: teamBonusNextGoalV2(unit, count), byPerson};
  }
  const count = uniqueSaleCount(unitSales);
  const total = teamBonusTotal(unit, count);
  const nextGoal = teamBonusNextGoal(unit, count);

  const cadShare = unit === 'club' ? 0.5 : 0.7;
  const cadPeople = {}, convPeople = {};
  unitSales.forEach(s => {
    if (s.role === 'cadastro' || s.role === 'consultor' || s.role === 'completo') {
      cadPeople[s.consultant] = (cadPeople[s.consultant]||0) + 1;
    } else if (s.role === 'conversao') {
      convPeople[s.consultant] = (convPeople[s.consultant]||0) + 1;
    }
  });
  const cadTotalCount = Object.values(cadPeople).reduce((a,b)=>a+b, 0);
  const convNames = Object.keys(convPeople);
  const cadPool  = total * cadShare;
  const convPool = total * (1 - cadShare);

  const byPerson = {};
  Object.keys(cadPeople).forEach(name => {
    byPerson[name] = (byPerson[name]||0) + (cadTotalCount > 0 ? cadPool * (cadPeople[name]/cadTotalCount) : 0);
  });
  convNames.forEach(name => {
    byPerson[name] = (byPerson[name]||0) + (convNames.length > 0 ? convPool / convNames.length : 0);
  });

  return {count, total, nextGoal, byPerson};
}

// Trava de verdade (não só esconder o botão do menu): decide aqui, no ponto que
// efetivamente desenha o conteúdo, se a sessão atual pode ver esta seção. Cobre
// qualquer jeito de o app chegar num id indevido (estado antigo vazando de outra
// sessão, corrida de sincronização, bug futuro) — nunca desenha dado sensível sem
// checar de novo, mesmo que o menu já devesse ter escondido o botão.
function sectionAllowed(id) {
  const isCoord = session.role === 'coordinator';
  if (id === 'admin') return isCoord;
  if (id === 'sales')  return isCoord || salesVisibleToConsultants;
  return true;
}


// Cores dos gráficos no padrão WasFit (revisão de design 26/11), claras ou escuras conforme o tema na hora de desenhar
function corGrafico() {
  const esc = document.documentElement.dataset.tema === 'escuro';
  return esc ? { a: '#2EE6A0', b: '#3B82F6', c: '#9A9A9A', tinta: '#EDEDED', grade: '#2E2E2E' }
             : { a: '#16B981', b: '#2563EB', c: '#9AA3AE', tinta: '#1A1D23', grade: '#EBEBEB' };
}
function temaGraficos() {
  if (!window.Chart) return;
  const k = corGrafico();
  Chart.defaults.font.family = "'Geist', system-ui, sans-serif";
  Chart.defaults.color = k.tinta;
  Chart.defaults.borderColor = k.grade;
}
function renderSection(id) {
  ['overview','weekly','sales','ranking','disputes','compare','admin'].forEach(p => {
    document.getElementById('panel-'+p).classList.toggle('active', p===id);
  });

  if (!sectionAllowed(id)) {
    document.getElementById('panel-'+id).innerHTML = `
      <div class="empty-state">
        <div class="icon">🔒</div>
        <p>Esta área não está disponível para o seu usuário.</p>
      </div>`;
    return;
  }

  temaGraficos();
  const raw = getFilteredSales();
  const sales = pricedSales(raw);
  if (id === 'overview')  renderOverview(sales);
  if (id === 'weekly')    renderWeekly(raw);
  if (id === 'sales')     renderSales(sales);
  if (id === 'ranking')   renderRanking(sales);
  if (id === 'disputes')  renderDisputes(sales);
  if (id === 'compare')   renderCompare();
  if (id === 'admin')     renderAdmin();
}
