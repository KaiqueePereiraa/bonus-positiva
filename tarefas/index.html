<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Tarefas — Positiva</title>
<link rel="icon" href="../assets/logo-escuro.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/marca.css?v=20261106191808">
<link rel="stylesheet" href="css/app.css?v=20261106191808">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" defer></script>
</head>
<body>
<div class="app" id="app">
  <aside class="lateral" id="lateral" aria-label="Menu">
    <div class="marca">
      <img class="logo-img" src="../assets/logo-claro.png" alt="">
      <strong>Central de Tarefas<small>POSITIVA</small></strong>
    </div>
    <ul class="menu" id="menu"></ul>
    <div class="pe">
      <div class="quem"><div class="avatar" id="avatar"></div><div><b id="nome-usuario"></b><span id="papel-usuario"></span></div></div>
      <div class="acoes"><a id="trocar-area" href="../index.html" hidden>Trocar de área</a><button id="sair" type="button">Sair</button></div>
    </div>
  </aside>
  <div class="principal">
    <header class="topo">
      <button class="btn-menu" id="btn-menu" aria-label="Abrir menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 id="titulo">Carregando…</h1>
      <select class="ctrl sel-unidade" id="sel-unidade" aria-label="Unidade" hidden></select>
      <button class="sino" id="sino" aria-label="Avisos" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="cont" id="sino-cont" hidden></span>
      </button>
      <div class="painel-sino" id="painel-sino" hidden></div>
    </header>
    <main class="conteudo" id="conteudo"></main>
  </div>
</div>
<script type="module" src="js/app.js?v=20261106191808"></script>
</body>
</html>
