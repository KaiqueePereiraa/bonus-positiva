function weekBonusCard(unit) {
  const eq = equipeCfg(unit);
  if (eq ? !!eq.bonus_equipe?.trava_saidas : unit === GRUPO_ACQUA) return teamBonusCardV3(unit);
  const base = getFilteredSales(null, {includeUnassigned: false, allUnits: unidadesDoGrupo(unit).length > 1}).filter(s => noGrupo(s, unit));
  const b = computeTeamBonus(base, unit);
  const pct = b.nextGoal === 0 ? 100 : Math.min(100, Math.round((b.count / (b.count + b.nextGoal)) * 100));
  // v2: valor fixo por pessoa (a quantidade de pessoas elegíveis só mostra o total da unidade).
  const valueHtml = b.v2
    ? `R$ ${money(b.perPerson)} <span style="font-size:13px;font-weight:600">por consultora</span>`
    : `R$ ${money(b.total)}`;
  const peopleTxt = b.v2 && b.perPerson > 0 ? ` · ${b.people} pessoa${b.people!==1?'s':''} (R$ ${money(b.total)} no total)` : '';
  return `
    <div class="kpi-card ${b.total > 0 ? 'highlight' : ''}">
      <div class="kpi-label">Bônus de Equipe — ${rotuloGrupo(unit)}</div>
      <div class="kpi-value">${valueHtml}</div>
      <div class="kpi-sub">${b.count} contrato${b.count!==1?'s':''} no mês${peopleTxt}
        ${b.nextGoal > 0 ? ` · faltam ${b.nextGoal} pra próxima faixa` : ' · faixa máxima'}${b.clubV3 ? `<br>R$ ${(b.steps || CLUB_V3_TEAM.steps.map((st, i) => [st, CLUB_V3_TEAM.amounts[i]])).map(([st, v]) => `${v} com ${st}`).join(' · ')}+ vendas (só matrícula nova e rematrícula; ${eq ? 'meia meta vale meio' : 'Black vale meio'})` : ''}</div>
    </div>`;
}

function teamBonusCardV3(g = GRUPO_ACQUA) {
  const b = computeTeamBonus(getFilteredSales(null, {includeUnassigned: false, allUnits: true}), g);
  const r = b.regua;
  const pct = b.nextGoal === 0 ? 100 : Math.min(100, Math.round((b.count / (b.count + b.nextGoal)) * 100));
  const alvoSaidas = b.saidas != null ? b.saidas : Math.round(b.saidasBase);
  const caixa = b.trava === 'aberta' ? `✓ repôs as ${b.saidas} saídas do mês`
    : b.trava === 'fechada' ? `✗ saíram ${b.saidas} alunos — extras travados`
    : `para não perder alunos: ${alvoSaidas} (${b.count >= alvoSaidas ? 'já passou da média' : `faltam ${alvoSaidas - b.count}`}; libera quando as saídas do mês forem lançadas)`;
  const valor = b.trava === 'aberta' ? b.perPerson : b.previsto;
  return `
    <div class="kpi-card ${b.total > 0 ? 'highlight' : ''}">
      <div class="kpi-label">Bônus de Equipe — ${rotuloGrupo(g)}</div>
      <div class="kpi-value">R$ ${money(valor)} <span style="font-size:13px;font-weight:600">por consultora${b.trava === 'pendente' && valor ? ' (previsto)' : b.trava === 'fechada' && valor ? ' (travado)' : ''}</span></div>
      <div class="kpi-sub">${b.count} contrato${b.count!==1?'s':''} da equipe no mês · ${b.steps ? b.steps.map(([st, v]) => `R$ ${money(v)} com ${st}`).join(', ') : `R$ 200 com ${r.equipe_200}, R$ 300 com ${r.equipe_300}`}
        ${b.nextGoal > 0 ? ` · faltam ${b.nextGoal} pra próxima faixa` : ' · faixa máxima'}<br>Caixa d'água: ${caixa}</div>
    </div>`;
}

// Semana 'closed' (já terminou), 'current' (hoje cai dentro dela) ou 'upcoming' (ainda
// não começou) — evita que uma semana em andamento com poucos contratos pareça "fechada
// em 0%", quando na verdade ainda dá tempo de bater a meta.
function dateOnly(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function weekStatus(range) {
  const today = dateOnly(new Date());
  if (today > range.end) return 'closed';
  if (today < range.start) return 'upcoming';
  return 'current';
}
function weekStatusBadge(status) {
  if (status === 'current')  return '<span class="tag" style="background:#e3f2fd;color:#1565c0;font-size:10px;margin-left:6px">Em andamento</span>';
  if (status === 'upcoming') return '<span class="tag" style="background:#f5f5f5;color:#999;font-size:10px;margin-left:6px">Ainda não começou</span>';
  return '';
}

function weekCardHtml(w, unit, name) {
  const fmt = d => d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
  const pctLabel = w.pct === 0 ? '0%' : Math.round(w.pct*100) + '%';
  const parts = [];
  if (w.typeBreak.novos)        parts.push(`${w.typeBreak.novos} novo${w.typeBreak.novos!==1?'s':''}`);
  if (w.typeBreak.rematriculas) parts.push(`${w.typeBreak.rematriculas} rematríc.`);
  if (w.typeBreak.renovacoes)   parts.push(`${w.typeBreak.renovacoes} renov.`);
  const breakdown = parts.length ? ` (${parts.join(' · ')})` : '';
  return `
    <div class="kpi-card ${w.pct >= 1 ? 'highlight' : ''}">
      <div class="kpi-label">Semana ${w.wk} · ${fmt(w.range.start)}–${fmt(w.range.end)}${weekStatusBadge(w.status)}</div>
      <div class="kpi-value">R$ ${money(w.earned)}</div>
      <div class="kpi-sub">${w.count} contrato${w.count!==1?'s':''}${breakdown} · ${w.label} (${pctLabel})
        ${w.toNext > 0 ? `<br>faltam ${w.toNext} pra próxima faixa` : ''}${centralLinha(w.central)}</div>
      ${w.hasAny ? `<button class="btn-sm" style="margin-top:10px;background:#eef1f4;color:var(--navy)" onclick="openWeekDetailModal('${name}','${unit}',${w.wk})">Ver alunos</button>` : ''}
    </div>`;
}

// Linha do bônus da Central no cartão da semana (v3)
function centralLinha(c) {
  if (!c || !c.semana) return '';
  const pts = `${money(c.pontos)} pts`;
  if (c.valor > 0) return `<br><span style="color:#2e7d32;font-weight:700">⭐ Central: ${c.nivel} (+${Math.round(c.pct*100)}%) · +R$ ${money(c.valor)}</span> <span style="color:var(--mid)">(${pts})</span>`;
  if (c.pendente) return `<br><span style="color:#e65100;font-weight:700">⭐ Central: ${c.nivel} · +R$ ${money(c.previsto)} previsto</span> <span style="color:var(--mid)">(${c.motivo})</span>`;
  if (c.pct > 0) return `<br><span style="color:#c62828">⭐ Central: ${c.nivel}, mas ${c.motivo}</span>`;
  return `<br><span style="color:var(--mid)">⭐ Central: ${c.motivo}</span>`;
}

// `unit` pode ser uma unidade ou o grupo 'acqua' (v3: Laranjeiras + República juntas)
function personWeeklyRows(name, unit, rawSales, priced) {
  const bounds = weekBoundsForMonth(activeMonth);
  if (!bounds) return [];
  return bounds.map((range, i) => {
    const wk = i + 1;
    const weekSales = rawSales.filter(s => s.consultant === name && noGrupo(s, unit) && weekIndexForSale(s) === wk);
    const metaSales = weekSales.filter(countsToGoal);
    const mc = somaMeta(metaSales);
    const earned = priced
      .filter(s => s.consultant === name && noGrupo(s, unit) && weekIndexForSale(s) === wk)
      .reduce((a,s) => a + s.commission, 0);
    const typeBreak = {
      novos:        metaSales.filter(s=>s.type==='new').length,
      rematriculas: metaSales.filter(s=>s.type==='renewal' && s.source!=='filtro').length,
      renovacoes:   metaSales.filter(s=>s.type==='renewal' && s.source==='filtro').length,
    };
    return {
      wk, range, earned, typeBreak,
      count: mc,
      hasAny: weekSales.length > 0,
      pct: weeklyTierPct(unit, mc),
      label: weekTierLabel(unit, mc),
      toNext: weekTierNextGoal(unit, mc),
      status: weekStatus(range),
      central: temCentral(unit) ? centralDaSemana(name, wk, mc, earned, null, unit) : null,
    };
  });
}

// Modal com a lista de alunos de uma pessoa numa semana — inclui também as conversões
// dela (não contam pra meta, mas entram no valor ganho), marcadas à parte.
function openWeekDetailModal(name, unit, wk) {
  const bounds = weekBoundsForMonth(activeMonth);
  if (!bounds) return;
  const range = bounds[wk - 1];
  const juntas = unidadesDoGrupo(unit).length > 1;
  const raw    = getFilteredSales(null, {includeUnassigned: false, allUnits: juntas});
  const priced = pricedSales(raw);
  const weekSales   = raw.filter(s => s.consultant === name && noGrupo(s, unit) && weekIndexForSale(s) === wk);
  const weekPriced  = priced.filter(s => s.consultant === name && noGrupo(s, unit) && weekIndexForSale(s) === wk);
  const metaCount   = somaMeta(weekSales.filter(countsToGoal));
  const earned      = weekPriced.reduce((a,s) => a + s.commission, 0);
  const pct         = weeklyTierPct(unit, metaCount);
  const fmt = d => d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});

  document.getElementById('week-detail-title').textContent = `${shortName(name)} — Semana ${wk}`;
  document.getElementById('week-detail-info').innerHTML = `
    <strong>Período:</strong> ${fmt(range.start)}–${fmt(range.end)}${weekStatusBadge(weekStatus(range))}<br>
    <strong>${weekTierLabel(unit, metaCount)}</strong> (${Math.round(pct*100)}%) · <strong>${metaCount}</strong> contrato${metaCount!==1?'s':''} pra meta ·
    <strong>R$ ${money(earned)}</strong> ganho na semana${centralLinha(temCentral(unit) ? centralDaSemana(name, wk, metaCount, earned, null, unit) : null)}
  `;

  const rows = weekSales.map(s => {
    const isMeta = countsToGoal(s);
    const p = weekPriced.find(x => x.line_id === s.line_id);
    const typeTxt = s.type === 'new' ? 'Novo' : s.kind === 'upgrade' ? 'Upgrade' : (s.source === 'filtro' ? 'Renovação' : 'Rematrícula');
    return `<tr>
      <td>${s.student}${juntas ? `<div style="font-size:10px;color:var(--mid)">${UNIT_LABELS[s.unit] || s.unit}</div>` : ''}</td>
      <td>${typeTxt}</td>
      <td style="font-size:12px">${s.contract}</td>
      <td>${roleLabel(s)}${!isMeta ? '<div style="font-size:10px;color:var(--mid)">não conta pra meta</div>' : pesoMeta(s) !== 1 ? `<div style="font-size:10px;color:var(--mid)">vale ${pesoMeta(s) === 0.5 ? 'meio contrato' : `${String(pesoMeta(s)).replace('.', ',')} contrato`} na meta</div>` : ''}</td>
      <td style="text-align:right">R$ ${money(p ? p.commission : s.commission)}</td>
    </tr>`;
  }).join('');

  document.getElementById('week-detail-body').innerHTML = weekSales.length ? `
    <table class="data-table">
      <thead><tr><th>Aluno</th><th>Tipo</th><th>Contrato</th><th>Papel</th><th style="text-align:right">Valor</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` : '<div class="empty-state" style="padding:16px 0"><p>Nenhuma venda dessa pessoa nessa semana.</p></div>';

  openModal('modal-week-detail');
}

// Explicação curta das regras de cada equipe no topo da aba Semanal (com configuração; sem ela, os textos antigos abaixo)
function regrasSub(grupos) {
  if (!cfgDoMes()) return (policyV3(activeMonth) ? metaV3Sub() : '') + (grupos.some(u => ehClubV3(u)) ? clubV3Sub() : '');
  return grupos.map(g => {
    const e = equipeCfg(g);
    if (!e) return '';
    const fx = BonusMotor.faixasSemana(e, reguaDe()).slice(0, -1).reverse();
    const faixas = fx.map(([n, p, nome], i) => `${nome} ${n}${i === fx.length - 1 ? '+' : ''} contrato${n !== 1 ? 's' : ''} (${Math.round(p * 100)}%)`).join(' · ');
    const saidas = e.meta?.modo === 'saidas' ? ` — saídas usadas na meta: ${money(reguaDe().saidas_base)} por mês, ${reguaDe().consultoras} consultoras` : '';
    const meias = (e.planos || []).filter(p => p.meta === 0.5);
    const meia = meias.length ? `; planos de meia meta (ex.: ${meias[0].texto}) valem meio contrato` : '';
    const ren = e.renovacao?.paga ? '; renovação, troca e upgrade pagam, mas não contam pra meta' : '';
    const re = e.renda_extra?.faixas?.length ? `. ${e.renda_extra.nome || 'Renda extra'}: ${e.renda_extra.faixas.map((f, i, a) => `${f.pct}% (${a[i + 1] ? `${f.min} a ${a[i + 1].min - 1}` : `${f.min}+`})`).join(', ')} na semana, fora da meta` : '';
    return `<br>${rotuloGrupo(g)}: ${faixas} por semana${saidas}${meia}${ren}${re}.`;
  }).join('');
}
function parteTexto(vendas, i) {
  const ps = [...new Set(vendas.map(s => divisaoNova(s.unit, s.month)[i]))];
  return ps.length === 1 ? `${ps[0]}%` : ps.length ? 'sua parte' : `${divisaoNova(activeUnit || '', activeMonth)[i]}%`;
}
// Explicação curta da meta v3 (Acqua) para o topo da aba Semanal
function metaV3Sub() {
  const r = reguaDe();
  return `<br>Acqua (Laranjeiras + República juntas): Entrada ${r.entrada} contrato${r.entrada!==1?'s':''} (30%) · Básico ${r.basico} (60%) · Meta real ${r.meta_real}+ (100%) por semana — saídas usadas na meta: ${money(r.saidas_base)} por mês, ${r.consultoras} consultoras.`;
}
// Explicação curta da meta do Club (nov/2026+) para o topo da aba Semanal
function clubV3Sub() {
  return `<br>Club: Básico 4 contratos (50%) · Meta real 7 (70%) · Super meta 10+ (100%) por semana — cada Black vale meio contrato; renovação, troca e upgrade pagam, mas não contam pra meta. Plano CLT Laranjeiras: renda extra de 20% (1 a 3 na semana), 25% (4 a 6), 30% (7 a 9) ou 35% (10+) do bônus de um Seja, fora da meta.`;
}
// Prêmio mensal do Club (vale-compras): quantas semanas em Super meta; perde se alguma semana já fechada ficou abaixo do Básico
function premioClub(weeks, g = 'club') {
  const e = equipeCfg(g);
  if (e) return BonusMotor.premio(e, weeks);
  const supers = weeks.filter(w => w.pct >= 1).length;
  const perdeu = PREMIO_CLUB.pisoTodas && weeks.some(w => w.status === 'closed' && w.pct === 0);
  const faixa = PREMIO_CLUB.faixas.find(([n]) => supers >= n);
  return { supers, perdeu, valor: !perdeu && faixa ? faixa[1] : 0, aberto: weeks.some(w => w.status !== 'closed') };
}
function premioClubCard(weeks, g = 'club') {
  const p = premioClub(weeks, g);
  const e = equipeCfg(g);
  const cfgP = e?.premio ? { faixas: e.premio.faixas.map(f => [f.semanas, f.valor]).sort((a, b) => b[0] - a[0]), pisoTodas: !!e.premio.piso_todas, nome: e.premio.nome } : { ...PREMIO_CLUB, nome: 'vale-compras Showroom Dus2' };
  const topo = (weekTierNames(g)[0] || [])[1] || 'Super meta', base = (weekTierNames(g).slice(-2)[0] || [])[1] || 'Básico';
  const regra = `R$ ${cfgP.faixas.slice().reverse().map(([n, v]) => `${v} com ${n}`).join(' · ')} semanas em ${topo}${cfgP.pisoTodas ? `, sem nenhuma semana abaixo do ${base}` : ''}`;
  const sub = p.perdeu ? `uma semana ficou abaixo do ${base} — sem prêmio este mês` : `${p.supers} de 4 semana${p.supers !== 1 ? 's' : ''} em ${topo}${p.aberto ? ' até agora' : ''}`;
  return `<div class="kpi-grid"><div class="kpi-card ${p.valor > 0 ? 'highlight' : ''}">
    <div class="kpi-label">🎁 Prêmio do mês${cfgP.nome ? ` — ${cfgP.nome}` : ''}</div>
    <div class="kpi-value">R$ ${money(p.valor)}${p.valor > 0 && p.aberto ? ' <span style="font-size:13px;font-weight:600">garantido até agora</span>' : ''}</div>
    <div class="kpi-sub">${sub}<br>${regra}. Pago à parte, fora do Pix do bônus.</div>
  </div></div>`;
}
// Resumo do bônus da Central no mês, para a consultora
function centralResumoHtml(weeks) {
  const c = CENTRAL[activeMonth];
  if (!c) return '';
  const valor = weeks.reduce((a, w) => a + (w.central ? w.central.valor : 0), 0);
  const previsto = weeks.reduce((a, w) => a + (w.central && w.central.pendente ? w.central.previsto : 0), 0);
  return `<div class="kpi-grid"><div class="kpi-card ${valor > 0 ? 'highlight' : ''}">
    <div class="kpi-label">⭐ Bônus da Central — ${activeMonth}</div>
    <div class="kpi-value">R$ ${money(valor)}${previsto > 0 ? ` <span style="font-size:13px;font-weight:600">+ R$ ${money(previsto)} previsto</span>` : ''}</div>
    <div class="kpi-sub">Pontos por semana: matrícula 4, renovação 3, pagamento 2, voltou a treinar 1 (+ esforço e medalhas, até 5).
      Bom a partir de ${money(c.bom)} pontos (+5%), Ótimo a partir de ${money(c.otimo)} (+20%) — régua: a melhor da equipe.
      Só vale na semana em que você bate o Básico e o mínimo em 4 de 5 dias, e no mês em que a equipe repõe as saídas.</div>
  </div></div>`;
}

function renderWeekly(rawSales) {
  const el = document.getElementById('panel-weekly');
  const isCoord = session.role === 'coordinator';
  const bounds = weekBoundsForMonth(activeMonth);

  if (!bounds) {
    el.innerHTML = `<div class="empty-state"><div class="icon">📅</div><p>Não foi possível calcular as semanas de ${activeMonth}.</p></div>`;
    return;
  }

  // v3: Laranjeiras + República aparecem juntas (uma meta só) — conta com as vendas das duas, mesmo na aba de uma unidade
  const v3 = cfgDoMes() ? gruposDe(UNIT_KEYS).some(g => unidadesDoGrupo(g).length > 1) : policyV3(activeMonth);
  if (v3) rawSales = getFilteredSales(null, {includeUnassigned: false, allUnits: true});
  const priced = pricedSales(rawSales);
  const unitsInView = gruposDe(activeUnit ? [activeUnit] : UNIT_KEYS);
  const bonusCardsHtml = unitsInView.map(weekBonusCard).join('');

  if (!isCoord) {
    // Quem vende em mais de uma unidade tem uma aba por unidade (ver buildTabs()) — aqui só
    // falta cobrir a visão combinada ("Meu Dashboard", sem unidade selecionada): mostra a
    // semana de CADA unidade em que a pessoa vende, não só a primeira que aparecer nos dados.
    const myUnits = gruposDe(activeUnit ? [activeUnit] : [...new Set(RAW_SALES.filter(s => s.consultant === session.name).map(s => s.unit))]);
    const myBonusHtml = (activeUnit ? unitsInView : myUnits).map(weekBonusCard).join('');
    const sectionsHtml = myUnits.map(uk => {
      const myWeeks = personWeeklyRows(session.name, uk, rawSales, priced);
      return `
        ${myUnits.length > 1 || unidadesDoGrupo(uk).length > 1 ? `<p class="page-title" style="font-size:17px;margin-top:20px">${rotuloGrupo(uk)}</p>` : ''}
        <div class="kpi-grid">${myWeeks.map(w => weekCardHtml(w, uk, session.name)).join('')}</div>
        ${temCentral(uk) ? centralResumoHtml(myWeeks) : ''}${temPremio(uk) ? premioClubCard(myWeeks, uk) : ''}`;
    }).join('');
    el.innerHTML = `
      <p class="page-title">Minha Semana</p>
      <p class="page-sub">${activeMonth} · meta contada pelos contratos que você cadastrou (ou rematrícula sua; renovação não conta a partir de setembro/2026)${regrasSub(myUnits)}</p>
      ${sectionsHtml}
      <p class="page-title" style="font-size:17px;margin-top:8px">Bônus de Equipe</p>
      <p class="page-sub">Coletivo — pago junto com o bônus individual</p>
      <div class="kpi-grid">${myBonusHtml}</div>
    `;
    return;
  }

  // Coordenador: todo mundo lado a lado, por unidade — clique numa célula pra ver quem são
  const unitTitle = activeUnit ? UNIT_LABELS[activeUnit] : 'Todas as Unidades';
  const rowsHtml = unitsInView.map(uk => {
    const consultants = getConsultants(rawSales.filter(s => noGrupo(s, uk)));
    if (!consultants.length) return '';
    const comCentral = temCentral(uk);
    const comPremio = temPremio(uk);
    const bodyRows = consultants.map(name => {
      const weeks = personWeeklyRows(name, uk, rawSales, priced);
      const total = weeks.reduce((a,w) => a + w.earned, 0);
      const central = weeks.reduce((a,w) => a + (w.central ? w.central.valor : 0), 0);
      const previsto = weeks.reduce((a,w) => a + (w.central && w.central.pendente ? w.central.previsto : 0), 0);
      const weekCells = weeks.map(w => `
        <td ${w.hasAny ? `style="cursor:pointer" onclick="openWeekDetailModal('${name}','${uk}',${w.wk})"` : ''}>
          <span class="tag" style="background:${w.pct>=1?'#e8f5e9':w.pct>0?'#fff3e0':'#ffebee'};color:${w.pct>=1?'#2e7d32':w.pct>0?'#e65100':'#c62828'}">
            ${w.count} · ${Math.round(w.pct*100)}%
          </span>${weekStatusBadge(w.status)}${comCentral && w.central && w.central.semana ? `<div style="font-size:10px;color:${w.central.valor > 0 ? '#2e7d32' : 'var(--mid)'};margin-top:3px" title="${w.central.motivo || ''}">⭐ ${money(w.central.pontos)} pts${w.central.pct ? ` · ${w.central.nivel}` : ''}</div>` : ''}
        </td>`).join('');
      return `<tr><td>${shortName(name)}</td>${weekCells}<td><strong>R$ ${money(total)}</strong></td>${comCentral ? `<td>${central > 0 ? `<strong style="color:#2e7d32">+R$ ${money(central)}</strong>` : previsto > 0 ? `<span style="color:#e65100">+R$ ${money(previsto)} previsto</span>` : '—'}</td>` : ''}${comPremio ? (() => { const p = premioClub(weeks, uk); return `<td title="${p.supers} semana(s) em Super meta">${p.valor > 0 ? `<strong style="color:#2e7d32">R$ ${money(p.valor)}</strong>` : p.perdeu ? '<span style="color:#c62828">—</span>' : `<span style="color:var(--mid)">${p.supers}/4 Super</span>`}</td>`; })() : ''}</tr>`;
    }).join('');
    return `
      <div class="table-card">
        <h3>${rotuloGrupo(uk)}</h3>
        <p style="font-size:12px;color:var(--mid);margin-bottom:12px">Clique numa célula pra ver quem são os alunos daquela semana.${comCentral ? ` ⭐ = pontos da Central na semana (Bom a partir de ${money((CENTRAL[activeMonth] || {}).bom || 0)}, Ótimo a partir de ${money((CENTRAL[activeMonth] || {}).otimo || 0)}).` : ''}</p>
        <table class="data-table">
          <thead><tr><th>Consultor</th><th>Sem. 1</th><th>Sem. 2</th><th>Sem. 3</th><th>Sem. 4</th><th>Total no mês</th>${comCentral ? '<th>Bônus da Central</th>' : ''}${comPremio ? '<th>Prêmio (vale)</th>' : ''}</tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>`;
  }).join('');

  el.innerHTML = `
    <p class="page-title">Semanal — ${unitTitle}</p>
    <p class="page-sub">${activeMonth} · meta semanal (segunda a domingo) por pessoa, contada pelos cadastros/rematrículas/renovações dela${regrasSub(unitsInView)}</p>
    <div class="kpi-grid">${bonusCardsHtml}</div>
    ${rowsHtml || '<div class="empty-state"><div class="icon">📭</div><p>Nenhum consultor com vendas no período.</p></div>'}
  `;
}

              <td>${shortName(d.consultant)}</td>
              <td>${d.unit_label}</td>
              <td>${d.reason}</td>
              <td>${d.createdAt}</td>
              <td style="color:#c62828;font-weight:800">-R$ ${money(d.amount)}</td>
              <td><button class="btn-del" onclick="removeDeduction('${d._localId}')">Remover</button></td>
            </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty-state" style="padding:16px 0"><p>Nenhum desconto lançado neste mês${unit?' nesta unidade':''}.</p></div>`}
      <div class="add-user-form">
        <select id="ded-consultant">${names.map(c=>`<option value="${c}">${shortName(c)}</option>`).join('')}</select>
        <select id="ded-unit">${UNIT_KEYS.map(u=>`<option value="${u}" ${u===unit?'selected':''}>${UNIT_LABELS[u]||u}</option>`).join('')}</select>
        <input id="ded-amount" placeholder="Valor (R$)" style="max-width:120px">
        <input id="ded-reason" placeholder="Motivo do desconto" style="flex:2;min-width:220px">
        <button class="btn-add" onclick="addDeduction()">− Descontar</button>
      </div>
    </div>
  `;
}

async function addDeduction() {
  const consultant = document.getElementById('ded-consultant').value;
  const unit       = document.getElementById('ded-unit').value;
  const amountRaw  = document.getElementById('ded-amount').value.trim().replace(',', '.');
  const amount     = parseFloat(amountRaw);
  const reason     = document.getElementById('ded-reason').value.trim();

  if (!consultant || !unit) { alert('Selecione o consultor e a unidade.'); return; }
  if (!amountRaw || isNaN(amount) || amount <= 0) { alert('Informe um valor de desconto válido.'); return; }
  if (!reason) { alert('Informe o motivo do desconto.'); return; }

  const newDeduction = {
    _localId: Date.now() + '-' + Math.random().toString(36).slice(2),
    consultant, unit, unit_label: UNIT_LABELS[unit] || unit,
    amount, reason, month: activeMonth,
    createdBy: session.name, createdAt: new Date().toLocaleDateString('pt-BR'),
  };
  deductions.push(newDeduction);
  saveDeductionsLocal(deductions);
  destroyCharts();
  renderSection('sales');
  await sbAddDeduction(newDeduction);
}

async function removeDeduction(localId) {
  if (!confirm('Remover este desconto? O bônus da pessoa volta ao valor cheio.')) return;
  deductions = deductions.filter(d => d._localId !== localId);
  saveDeductionsLocal(deductions);
  destroyCharts();
  renderSection('sales');
  await sbDeleteDeduction(localId);
}

function applyFilters() {
  const search   = (document.getElementById('search-sales')?.value || '').toLowerCase();
  const type     = document.getElementById('type-filter')?.value || '';
  const cons     = document.getElementById('consultant-filter')?.value || '';
  const unit     = document.getElementById('unit-filter')?.value || '';
  const onlyRev  = document.getElementById('review-filter')?.checked || false;
  const isCoord = session.role === 'coordinator';
  let sales = pricedSales(getFilteredSales(null, isCoord ? {includeUnassigned:true} : null));
  if (type)    sales = sales.filter(s=>s.type===type);
  if (cons)    sales = sales.filter(s=>s.consultant===cons);
  if (unit)    sales = sales.filter(s=>s.unit===unit);
  if (onlyRev) sales = sales.filter(s=>s.needs_review);
  if (search) sales = sales.filter(s=>
    s.student.toLowerCase().includes(search) ||
    s.id.toLowerCase().includes(search) ||
    (s.consultant||'').toLowerCase().includes(search)
  );
  renderSalesTable(sales);
}

function renderSalesTable(sales) {
  const body = document.getElementById('sales-table-body');
  if (!body) return;
  if (!sales.length) {
    body.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>Nenhuma venda encontrada.</p></div>';
    return;
  }

  const isCoord = session.role === 'coordinator';
  const overrides = loadOverrides();

  // Célula com os dados que variam por pessoa (Consultor, Tipo/Papel, Comissão, Ação).
  // Cada linha de comissão mantém sua própria disputa e botão de contestação, mesmo
  // quando exibida agrupada com o outro lado de uma matrícula dividida (cadastro/conversão).
  function personCell(s) {
    const dispute = disputes.find(d=>d.saleId===s.line_id && d.unit===s.unit && d.status==='open');
    const resolved= disputes.find(d=>d.saleId===s.line_id && d.unit===s.unit && d.status==='resolved');
    const isDisp  = !!dispute;
    const isRes   = !!resolved;
    const isMe    = s.consultant === session.name;
    const isUnassigned = !s.consultant;
    const isManual = !!s._manual;
    const isAlreadyUnassigned = overrides.unassigned.some(u => u.id === s.line_id && u.unit === s.unit);
    let statusTag = '';
    if (isDisp) statusTag = ' <span class="tag tag-disputed" style="font-size:9px">Disputa</span>';
    else if (isRes) statusTag = ' <span class="tag tag-resolved" style="font-size:9px">Resolvida</span>';

    const isEditOfReport = isManual && RAW_SALES.some(r => r.line_id === s.line_id);
    const editBtn = `<button class="btn-edit-pw" onclick="openEditSaleModal('${s.line_id}','${s.unit}')" style="font-size:11px;padding:3px 8px;margin-right:4px">Editar</button>`;

    let actionCell = '<td></td>';
    if (isCoord) {
      if (isEditOfReport) {
        actionCell = `<td>${editBtn}<span class="tag" style="background:#ede7f6;color:#5e35b1;font-size:11px;margin-right:6px">Editada</span><button class="btn-del" onclick="deleteAddedSale('${s.line_id}')" style="font-size:11px;padding:3px 8px">Reverter</button></td>`;
      } else if (isManual) {
        actionCell = `<td>${editBtn}<span class="tag" style="background:#e3f2fd;color:#1565c0;font-size:11px;margin-right:6px">Manual</span><button class="btn-del" onclick="deleteAddedSale('${s.line_id}')" style="font-size:11px;padding:3px 8px">Excluir</button></td>`;
      } else if (isAlreadyUnassigned) {
        // O coordenador removeu o dono manualmente antes (via "Remover Dono") — reatribuir
        // devolve ao consultor original do relatório.
        actionCell = `<td>${editBtn}<button class="btn-sm btn-approve" onclick="reassignSale('${s.line_id}','${s.unit}')" style="font-size:11px">Reatribuir</button></td>`;
      } else if (isUnassigned) {
        // Já veio sem consultor do próprio relatório (ex.: "Cadastrado por" em branco) —
        // não existe um "dono original" pra reatribuir, então só "Editar" (escolher alguém
        // manualmente) faz sentido aqui. Mostrar "Reatribuir" nesse caso não fazia nada ao
        // clicar, o que parecia um botão quebrado.
        actionCell = `<td>${editBtn}</td>`;
      } else {
        actionCell = `<td>${editBtn}<button class="btn-sm btn-reject" onclick="unassignSale('${s.line_id}','${s.unit}')" style="font-size:11px">Remover Dono</button></td>`;
      }
    } else {
      if (!isMe && !isDisp && !isRes && !isUnassigned && contestacaoAberta(MONTH)) {
        actionCell = `<td><button class="btn-dispute" onclick="openDisputeModal('${s.line_id}','${s.unit}')">Contestar</button></td>`;
      } else if (isDisp && dispute.claimant === session.name) {
        actionCell = `<td><span style="font-size:12px;color:var(--warning);font-weight:700">Aguardando</span></td>`;
      } else if (isDisp && s.consultant === session.name && !dispute.defense) {
        actionCell = `<td><button class="btn-sm btn-approve" onclick="openDefenseModal(${disputes.indexOf(dispute)})" style="font-size:11px">⚔️ Me Defender</button></td>`;
      } else if (isDisp && s.consultant === session.name && dispute.defense) {
        actionCell = `<td><span style="font-size:12px;color:var(--success);font-weight:700">✓ Defesa enviada</span></td>`;
      }
    }

    const role = roleLabel(s);
    const isRecon = s.type === 'renewal' && s.source === 'filtro';
    const typeTagClass = s.type === 'new' ? 'tag-new' : (isRecon ? 'tag-type' : 'tag-renewal');
    const typeTagText  = s.type === 'new' ? 'Novo' : (isRecon ? 'Renovação' : 'Rematrícula');
    const consultantCell = isUnassigned
      ? '<span class="tag" style="background:#f5f5f5;color:#999;font-size:11px">Sem consultor</span>'
      : `${shortName(s.consultant)} ${isMe?'<span class="tag" style="background:#e8f5e9;color:#2e7d32;font-size:10px">Você</span>':''}${statusTag}`;
    return {
      isMe, isUnassigned,
      front: `
        <td>${consultantCell}</td>
        <td><span class="tag ${typeTagClass}">${typeTagText}</span>${role?`<div style="font-size:11px;color:var(--mid);margin-top:2px">${role}</div>`:''}${isRecon?'<div style="font-size:10px;color:var(--mid);margin-top:2px">Não capturada no relatório de rematrícula</div>':''}</td>
        <td><strong>R$ ${money(s.commission)}</strong> ${s.needs_review?'<span class="tag" style="background:#fff3e0;color:#e65100;font-size:10px" title="Plano não reconhecido na tabela de bônus — valor padrão aplicado, revise">⚠ Revisar</span>':''}</td>`,
      actionCell,
    };
  }

  // Agrupa cadastro + conversão da mesma matrícula em um único bloco visual —
  // são duas linhas de comissão distintas, mas representam uma única venda.
  const groups = [];
  const index = new Map();
  sales.forEach(s => {
    if (index.has(s.id)) { index.get(s.id).push(s); }
    else { const arr = [s]; index.set(s.id, arr); groups.push(arr); }
  });

  const rowsHtml = groups.map(group => {
    const isSplit = group.length === 2 && group.every(s => s.role === 'cadastro' || s.role === 'conversao');
    const ordered = isSplit
      ? [group.find(s=>s.role==='cadastro'), group.find(s=>s.role==='conversao')]
      : group;
    const [first, ...rest] = ordered;
    const span = ordered.length;

    const firstCell = personCell(first);
    let html = `<tr class="${firstCell.isMe?'mine':''}${isSplit?' split-pair':''}"${firstCell.isUnassigned?' style="opacity:.6"':''}>
      <td rowspan="${span}"><strong>#${first.id}</strong></td>
      <td rowspan="${span}">${first.student}</td>
      ${firstCell.front}
      <td rowspan="${span}">${first.date}</td>
      <td rowspan="${span}" style="max-width:200px;font-size:12px;color:var(--mid)">${first.contract.slice(0,40)}${first.contract.length>40?'…':''}</td>
      ${firstCell.actionCell}
    </tr>`;

    rest.forEach(s => {
      const cell = personCell(s);
      html += `<tr class="${cell.isMe?'mine':''}${isSplit?' split-pair split-sub':''}"${cell.isUnassigned?' style="opacity:.6"':''}>
        ${cell.front}
        ${cell.actionCell}
      </tr>`;
    });
    return html;
  }).join('');

  body.innerHTML = `<table class="data-table">
    <thead><tr>
      <th>ID</th><th>Aluno</th><th>Consultor</th><th>Tipo</th>
      <th>Bônus</th><th>Data</th><th>Contrato</th>
      <th>Ação</th>
    </tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>`;
}

function renderRanking(sales) {
  const el = document.getElementById('panel-ranking');

  const consultants = getConsultants(sales);

  const ranked = consultants.map(c => {

    return {
      name: c,
      comm: personTotal(c, sales, activeUnit),
      breakdown: roleBreakdown(cs),
      total: cs.length,

        ${ranked.map((r,i) => `
          <div class="ranking-row">

  const open     = relevantDisputes.filter(d=>d.status==='open');
  const resolved = relevantDisputes.filter(d=>d.status==='resolved');

  let html = `
    <p class="page-title">Disputas</p>
    <p class="page-sub">${MONTH} · ${open.length} aberta${open.length!==1?'s':''} · ${resolved.length} resolvida${resolved.length!==1?'s':''}</p>
  `;

  if (isCoord && open.length > 0) {
    html += `<div class="coordinator-notice">Você tem ${open.length} disputa${open.length!==1?'s':''} aguardando decisão.</div>`;
  }

  if (!relevantDisputes.length) {
    html += `<div class="empty-state"><div class="icon">✅</div><p>Nenhuma disputa registrada.</p></div>`;

  if (open.length) {

          <span class="tag tag-disputed">Em Disputa</span>

          <span class="tag tag-type">${disputeTypeLabel(d.saleId)}</span>
          <span style="color:var(--mid);font-size:13px">${d.unit_label}</span>
        </div>
        <p style="font-size:14px"><strong>Venda atual:</strong> ${shortName(d.originalConsultant)}</p>
        <p style="font-size:14px"><strong>Contestado por:</strong> ${shortName(d.claimant)}</p>
        <div style="background:#fff3e0;border-radius:8px;padding:10px 14px;margin:8px 0">
          <p style="font-size:13px"><strong>Motivo da contestação:</strong> ${d.reason}</p>
        </div>
        ${d.defense ? `
        <div style="background:#e8f5e9;border-radius:8px;padding:10px 14px;margin:8px 0">
          <p style="font-size:13px"><strong>Defesa de ${shortName(d.originalConsultant)}:</strong> ${d.defense}</p>
        </div>` : (session.name === d.originalConsultant && !isCoord ? `
        <div style="background:#fff8e1;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:12px;color:#f57f17">
          ⚠️ Você ainda não se defendeu desta contestação.
        </div>` : `
        <div style="background:#f5f5f5;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:12px;color:var(--mid)">
          Aguardando defesa de ${shortName(d.originalConsultant)}...
        </div>`)}
        <p style="font-size:12px;color:var(--mid)">Enviado em ${d.createdAt}</p>
        <div class="dispute-actions">
          ${isCoord ? `<button class="btn-sm btn-transfer" onclick="openResolveModal(${disputes.indexOf(d)})">Analisar e Decidir</button>` : ''}
          ${!isCoord && session.name === d.originalConsultant && !d.defense ? `<button class="btn-sm btn-approve" onclick="openDefenseModal(${disputes.indexOf(d)})">⚔️ Me Defender</button>` : ''}
        </div>
      </div>`;
    });
  }

  if (resolved.length) {
    html += `<h3 style="font-size:15px;font-weight:800;margin:20px 0 12px;color:var(--success)">Resolvidas (${resolved.length})</h3>`;
    resolved.forEach(d => {
      const transf = d.action === 'transfer';

        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 14px">

            <span style="${chip}background:#f0f2f5;color:var(--mid)"><small>De</small> <strong style="text-decoration:line-through">${de}</strong></span>

            <span style="${chip}background:#e8f5e9;color:#2e7d32"><small>Fica com</small> <strong>${de}</strong></span>

        </div>
      </div>`;
    });
  }

  el.innerHTML = html;
}

function renderCompare() {
  const el = document.getElementById('panel-compare');
  if (ALL_MONTHS.length < 2) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📅</div><p>Adicione dados de pelo menos 2 meses para comparar.</p></div>';
    return;
  }

  const defaultA = ALL_MONTHS[ALL_MONTHS.length - 2];
  const defaultB = ALL_MONTHS[ALL_MONTHS.length - 1];

  el.innerHTML = `
    <p class="page-title">Comparar Meses</p>
    <p class="page-sub">Selecione dois meses para comparar lado a lado</p>
    <div class="flex-row" style="margin-bottom:24px;gap:16px;flex-wrap:wrap;align-items:center">
      <select id="cmp-month-a" onchange="updateCompare()" style="font-size:15px;font-weight:800;padding:10px 16px;border:2px solid var(--navy);border-radius:10px">
        ${ALL_MONTHS.map(m=>`<option value="${m}" ${m===defaultA?'selected':''}>${m}</option>`).join('')}
      </select>
      <span style="font-size:20px;color:var(--mid);font-weight:900">vs</span>
      <select id="cmp-month-b" onchange="updateCompare()" style="font-size:15px;font-weight:800;padding:10px 16px;border:2px solid var(--green);border-radius:10px">
        ${ALL_MONTHS.map(m=>`<option value="${m}" ${m===defaultB?'selected':''}>${m}</option>`).join('')}
      </select>
    </div>
    <div id="compare-body"></div>
  `;
  updateCompare();
}

function updateCompare() {
  const mA = document.getElementById('cmp-month-a')?.value;
  const mB = document.getElementById('cmp-month-b')?.value;
  if (!mA || !mB) return;

  if (chartCmp1) { chartCmp1.destroy(); chartCmp1 = null; }
  if (chartCmp2) { chartCmp2.destroy(); chartCmp2 = null; }

  const salesA = pricedSales(getFilteredSales(mA), mA);
  const salesB = pricedSales(getFilteredSales(mB), mB);

  function stats(sales) {
    const consultants = getConsultants(sales);
    return {
      total: uniqueSaleCount(sales),
      newCount: uniqueTypeCount(sales, 'new'),
      renCount: uniqueTypeCount(sales, 'renewal'),
      commission: calcCommission(sales),
      consultants: consultants.length,
      ranked: consultants.map(c => {
        const cs = salesForConsultant(c, sales);
        return {name:shortName(c), comm:calcCommission(cs), new:cs.filter(s=>s.type==='new').length, ren:cs.filter(s=>s.type==='renewal').length};
      }).sort((a,b)=>b.comm-a.comm),
    };
  }

  const stA = stats(salesA);
  const stB = stats(salesB);

  function delta(a, b) {
    const d = b - a;
    if (d === 0) return '<span style="color:var(--mid)">—</span>';
    const sign = d > 0 ? '+' : '';
    const color = d > 0 ? 'var(--success)' : 'var(--danger)';
    return `<span style="color:${color};font-weight:900">${sign}${d}</span>`;
  }
  function deltaR(a, b) {
    if (!a) return '';
    const d = ((b-a)/a*100).toFixed(1);
    const sign = d > 0 ? '+' : '';
    const color = d > 0 ? 'var(--success)' : 'var(--danger)';
    return `<span style="font-size:11px;color:${color}">${sign}${d}%</span>`;
  }

  // All consultants union
  const allConsultants = [...new Set([...stA.ranked.map(r=>r.name), ...stB.ranked.map(r=>r.name)])];

  const body = document.getElementById('compare-body');
  body.innerHTML = `
    <!-- KPI comparison -->
    <div class="table-card" style="margin-bottom:20px">
      <table class="data-table">
        <thead><tr>
          <th>Métrica</th>
          <th style="color:var(--navy)">${mA}</th>
          <th style="color:var(--dark)">${mB}</th>
          <th>Variação</th>
        </tr></thead>
        <tbody>
          <tr><td><strong>Total Vendas</strong></td><td>${stA.total}</td><td>${stB.total}</td><td>${delta(stA.total,stB.total)} ${deltaR(stA.total,stB.total)}</td></tr>

      <div class="chart-card">
        <h3>Novos vs Rematrícula — ${mA} vs ${mB}</h3>
        <canvas id="chart-cmp2"></canvas>
      </div>

      <h3 style="margin-bottom:16px">Desempenho por Consultor</h3>

          <th style="color:var(--dark)">Vendas ${mB}</th>

        <tbody>
          ${allConsultants.map(name => {
            const a = stA.ranked.find(r=>r.name===name) || {comm:0,new:0,ren:0};

  // Chart 1: comissão lado a lado por consultor

}

// Bônus configurável (27/11/2026): editor das regras da academia (o mesmo da trilha do 1º acesso na Central)
async function montarRegrasBonus() {
  const alvo = document.getElementById('bonus-regras-editor');
  if (!alvo) return;
  try {
    const [{ montarEditorBonus }, { data: unidades }, { data: versoes }] = await Promise.all([
      import('../shared/bonus-config-editor.js'),
      db.from('unidades').select('id, nome, grupo, ordem').order('ordem'),
      db.rpc('bonus_config_ler', { p_planos: true }),
    ]);
    if (!document.body.contains(alvo)) return;
    montarEditorBonus(alvo, {
      versoes: versoes || [], unidades: unidades || [], hoje: hojeSPBonus(), podeSalvar: !!session.super,
      salvar: async (mes, regras) => {
        const { data, error } = await db.rpc('bonus_config_salvar', { p_vale_de: mes, p_regras: regras });
        if (error) throw new Error(error.message);
        return data;
      },
      aoSalvar: async (versoes) => {
        BONUS_CONFIG.length = 0; BONUS_CONFIG.push(...versoes);
        await carregarReguas();
        showSyncToast('✓ Regras do Bônus salvas');
      },
    });
  } catch (e) {
    console.warn('Editor das regras do Bônus não carregou', e);
    alvo.innerHTML = '<p style="font-size:13px;color:var(--mid)">Não foi possível carregar as regras. Atualize a página.</p>';
  }
}

// Meta da Acqua (v3): saídas do mês lidas no dashboard da EVO (Laranjeiras + República). A meta de cada mês usa a média dos
// 3 meses anteriores; as saídas do próprio mês liberam (ou travam) os extras no fechamento. Só o administrador geral lança.
function adminMetaAcquaHtml() {
  const label = policyV3(activeMonth) ? activeMonth : 'Dezembro/2026';
  const r = REGUAS[label];
  const hoje = hojeSPBonus();
  const mesPassado = (() => { const a = +hoje.slice(0, 4), m = +hoje.slice(5, 7); return m === 1 ? `${a - 1}-12` : `${a}-${String(m - 1).padStart(2, '0')}`; })();
  return `
    <div class="admin-section">
      <h3>Meta da Acqua (Laranjeiras + República) — vale de dezembro/2026 em diante</h3>
      ${r ? `<p style="font-size:13px;color:var(--mid);margin-bottom:12px"><b>${label}:</b> saídas usadas na meta ${money(r.saidas_base)} por mês (média dos 3 meses anteriores) ÷ ${r.consultoras} consultoras ÷ 4 semanas →
        <b>Entrada ${r.entrada}</b> (30%) · <b>Básico ${r.basico}</b> (60%) · <b>Meta real ${r.meta_real}+</b> (100%) por semana.
        Bônus de equipe: R$ 200 com ${r.equipe_200} contratos, R$ 300 com ${r.equipe_300}.
        Saídas do próprio mês: <b>${r.saidas_mes != null ? r.saidas_mes : 'ainda não lançadas'}</b> (sem elas, os extras ficam "previstos").
        ${r.fixa ? 'Meta do mês travada (a partir do dia 4 ela não muda mais).' : 'Meta do mês provisória: trava no dia 4, depois das saídas do mês que fechou serem lançadas.'}
        Régua da Central: ${money(r.regua_central)} pontos por semana (Bom ${money(r.regua_central * 0.7)}, Ótimo ${money(r.regua_central * 0.9)}).</p>`
        : '<p style="font-size:13px;color:var(--mid);margin-bottom:12px">A régua ainda não carregou.</p>'}
      ${session.super ? `
      <p style="font-size:13px;color:var(--mid);margin-bottom:10px">Lance as saídas do mês que fechou (dashboard da EVO → saídas de cada unidade) até o dia 3. Elas entram na meta dos próximos 3 meses e liberam os extras do mês.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
        <label style="font-size:12px;font-weight:700">Mês<br><input type="month" id="saidas-mes" value="${mesPassado}" style="padding:6px 10px;border:1.5px solid var(--gray);border-radius:8px"></label>
        <label style="font-size:12px;font-weight:700">Saídas Laranjeiras<br><input type="number" min="0" id="saidas-lar" style="width:110px;padding:6px 10px;border:1.5px solid var(--gray);border-radius:8px"></label>
        <label style="font-size:12px;font-weight:700">Saídas República<br><input type="number" min="0" id="saidas-rep" style="width:110px;padding:6px 10px;border:1.5px solid var(--gray);border-radius:8px"></label>
        <label style="font-size:12px;font-weight:700">Consultoras (vazio = as ativas)<br><input type="number" min="1" id="saidas-cons" style="width:110px;padding:6px 10px;border:1.5px solid var(--gray);border-radius:8px"></label>
        <button class="btn-sm" onclick="salvarSaidas()">Salvar saídas</button>
      </div>` : '<p style="font-size:12px;color:var(--mid)">Só o administrador geral lança as saídas.</p>'}
    </div>`;
}
async function salvarSaidas() {
  const mes = document.getElementById('saidas-mes').value;
  const lar = document.getElementById('saidas-lar').value, rep = document.getElementById('saidas-rep').value;
  const cons = document.getElementById('saidas-cons').value;
  if (!mes || lar === '' || rep === '') { showSyncToast('Preencha o mês e as saídas das duas unidades'); return; }
  const { error } = await db.rpc('bonus_salvar_saidas', { p_mes: `${mes}-01`, p_laranjeiras: +lar, p_republica: +rep, p_consultoras: cons ? +cons : null });
  if (error) { showSyncToast('⚠ Não salvou: ' + error.message); return; }
  await carregarReguas();
  showSyncToast('✓ Saídas salvas');
  destroyCharts();
  renderSection(activeSection);
}

async function unassignSale(lineId, unit) {
  if (!confirm('Remover o dono desta venda? Ela ficará sem consultor atribuído.')) return;
  const overrides = loadOverrides();
  if (!overrides.unassigned.some(u => u.id === lineId && u.unit === unit)) {
    overrides.unassigned.push({ id: lineId, unit });
  }
  saveOverridesLocal(overrides);
  destroyCharts();
  renderSection('sales');
  await sbUnassignSale(lineId, unit);
}

async function reassignSale(lineId, unit) {
  const overrides = loadOverrides();
  overrides.unassigned = overrides.unassigned.filter(u => !(u.id === lineId && u.unit === unit));
  saveOverridesLocal(overrides);
  destroyCharts();
  renderSection('sales');
  await sbReassignSale(lineId, unit);
}

async function deleteAddedSale(lineId) {
  if (!confirm('Excluir esta venda manual?')) return;
  const overrides = loadOverrides();
  overrides.added = overrides.added.filter(s => s.line_id !== lineId);
  saveOverridesLocal(overrides);
  destroyCharts();
  renderSection('sales');
  await sbDeleteManualSale(lineId);
}

let pendingEditLineId = null; // null = adicionando venda nova; caso contrário, editando esta linha

function syncAddCommissionDefault() {
  // Só sugere o valor padrão ao ADICIONAR uma venda nova — nunca sobrescreve ao editar
  if (pendingEditLineId) return;
  const type = document.getElementById('add-type').value;
  document.getElementById('add-commission').value = type === 'new' ? '50' : '25';
}

function openAddSaleModal() {
  pendingEditLineId = null;
  const allSales = getFilteredSales();
  const consultants = getConsultants(allSales.filter(s => s.consultant));
  const sel = document.getElementById('add-consultant');
  sel.innerHTML = '<option value="">— Sem consultor —</option>' +
    consultants.map(c => `<option value="${c}">${shortName(c)}</option>`).join('');

  const unitSel = document.getElementById('add-unit');
  unitSel.innerHTML = UNIT_KEYS.map(u => `<option value="${u}">${UNIT_LABELS[u]||u}</option>`).join('');
  if (activeUnit) unitSel.value = activeUnit;

  document.getElementById('add-sale-title').textContent = 'Adicionar Venda Manualmente';
  document.getElementById('add-sale-sub').textContent = 'Use para incluir vendas que não apareceram nos relatórios.';
  document.getElementById('add-sale-submit').textContent = 'Adicionar Venda';
  document.getElementById('add-student').value = '';
  document.getElementById('add-date').value = '';
  document.getElementById('add-contract').value = '';
  document.getElementById('add-type').value = 'new';
  syncAddCommissionDefault();
  openModal('modal-add-sale');
}

function openEditSaleModal(lineId, unit) {
  const sale = getFilteredSales(null, {includeUnassigned:true}).find(s => s.line_id === lineId && s.unit === unit);
  if (!sale) return;
  pendingEditLineId = lineId;

  const allSales = getFilteredSales(null, {includeUnassigned:true});
  const consultants = getConsultants(allSales.filter(s => s.consultant));
  const sel = document.getElementById('add-consultant');
  sel.innerHTML = '<option value="">— Sem consultor —</option>' +
    consultants.map(c => `<option value="${c}">${shortName(c)}</option>`).join('');
  sel.value = sale.consultant || '';

  const unitSel = document.getElementById('add-unit');
  unitSel.innerHTML = UNIT_KEYS.map(u => `<option value="${u}">${UNIT_LABELS[u]||u}</option>`).join('');
  unitSel.value = sale.unit;

  document.getElementById('add-sale-title').textContent = 'Editar Venda';
  document.getElementById('add-sale-sub').textContent = !sale.consultant
    ? '⚠ Esta venda veio sem consultor no relatório (campo em branco) — escolha quem deve receber no campo "Consultor" abaixo.'
    : sale.needs_review
    ? '⚠ Este plano não está na tabela de bônus — ajuste o valor correto abaixo.'
    : 'Corrija os dados desta venda. A alteração fica registrada e sincronizada.';
  document.getElementById('add-sale-submit').textContent = 'Salvar Alterações';
  document.getElementById('add-student').value = sale.student;
  document.getElementById('add-type').value = sale.type;
  document.getElementById('add-date').value = sale.date;
  document.getElementById('add-contract').value = sale.contract;
  document.getElementById('add-commission').value = String(sale.commission).replace('.', ',');
  openModal('modal-add-sale');
}

async function submitAddSale() {
  const student    = document.getElementById('add-student').value.trim().toUpperCase();
  const consultant = document.getElementById('add-consultant').value;
  const type       = document.getElementById('add-type').value;
  const unit       = document.getElementById('add-unit').value;
  const date       = document.getElementById('add-date').value.trim();
  const contract   = document.getElementById('add-contract').value.trim() || '—';
  const commissionRaw = document.getElementById('add-commission').value.trim().replace(',', '.');
  const commission = parseFloat(commissionRaw);

  if (!student || !date || !unit) { alert('Preencha aluno, data e unidade.'); return; }
  if (!commissionRaw || isNaN(commission)) { alert('Informe um valor de bônus válido.'); return; }

  // Ao editar, preserva o id de exibição e o papel (cadastro/conversão/etc) da linha original —
  // só o line_id (chave técnica) e os campos editáveis mudam.
  const original = pendingEditLineId
    ? getFilteredSales(null, {includeUnassigned:true}).find(s => s.line_id === pendingEditLineId)
    : null;
  const lineId = pendingEditLineId || ('M' + Date.now());
  const displayId = original ? original.id : lineId;
  const role = original ? original.role : (consultant ? 'completo' : null);
  const newSale = {
    id: displayId, line_id: lineId, student, consultant, type, role,
    commission, date, contract,
    unit, unit_label: UNIT_LABELS[unit] || unit, month: MONTH, _manual: true, needs_review: false,
  };
  const overrides = loadOverrides();
  overrides.added = overrides.added.filter(s => s.line_id !== lineId);
  overrides.added.push(newSale);
  saveOverridesLocal(overrides);
  closeModal('modal-add-sale');
  destroyCharts();
  renderSection('sales');
  await sbAddManualSale(newSale);
}

function openDisputeModal(saleId, unit) {
  const sales = getFilteredSales();
  const sale = sales.find(s=>s.line_id===saleId&&s.unit===unit);
  if (!sale) return;
  pendingDisputeSale = {saleId, unit};
  document.getElementById('dispute-sale-info').innerHTML = `
    <strong>Aluno:</strong> ${sale.student} (#${sale.id})<br>
    <strong>${sale.role==='conversao'?'Convertido por':sale.role==='consultor'?'Consultor':'Cadastrado por'}:</strong> ${sale.consultant}<br>
    <strong>Bônus contestado:</strong> R$ ${money(sale.commission)} (${roleLabel(sale)})<br>
    <strong>Data:</strong> ${sale.date}<br>
    <strong>Contrato:</strong> ${sale.contract}
  `;
  document.getElementById('dispute-reason').value = '';
  openModal('modal-dispute');
}

async function submitDispute() {
  const reason = document.getElementById('dispute-reason').value.trim();
  if (!reason) { alert('Informe o motivo da contestação.'); return; }
  if (!contestacaoAberta(MONTH)) { alert('O prazo para contestar as vendas de ' + MONTH + ' terminou (vai até o dia 10 do mês seguinte).'); closeModal('modal-dispute'); return; }
  const sales = getFilteredSales();
  const sale  = sales.find(s=>s.line_id===pendingDisputeSale.saleId&&s.unit===pendingDisputeSale.unit);
  if (!sale) return;

  const newDispute = {
    _localId: Date.now() + '-' + Math.random().toString(36).slice(2),
    saleId: pendingDisputeSale.saleId,
    displayId: sale.id,
    unit:   pendingDisputeSale.unit,
    unit_label: UNIT_LABELS[pendingDisputeSale.unit] || pendingDisputeSale.unit,
    originalConsultant: sale.consultant,
    claimant: session.name,
    reason,
    status: 'open',
    createdAt: new Date().toLocaleDateString('pt-BR'),
    resolution: null, resolvedBy: null, resolvedAt: null, action: null,
    defense: null, defendedAt: null, month: MONTH,
  };
  disputes.push(newDispute);
  saveDisputesLocal(disputes);
  closeModal('modal-dispute');
  buildSectionNav();
  renderSection('disputes');
  await sbAddDispute(newDispute);
}

function openDefenseModal(idx) {

    <strong>Data:</strong> ${sale ? sale.date : '—'}
  `;

  document.getElementById('defense-reason').value = '';

}

async function submitDefense() {
  const defense = document.getElementById('defense-reason').value.trim();
  if (!defense) { alert('Escreva sua defesa antes de enviar.'); return; }
  disputes[pendingDefenseIdx].defense = defense;
  disputes[pendingDefenseIdx].defendedAt = new Date().toLocaleDateString('pt-BR');
  saveDisputesLocal(disputes);
  closeModal('modal-defense');
  buildSectionNav();
  renderSection('disputes');
  await sbUpdateDispute(disputes[pendingDefenseIdx]);
}

// ══════════════════════════════════════════════
function openResolveModal(idx) {
  pendingResolveIdx = idx;
  const d = disputes[idx];
  document.getElementById('resolve-info').innerHTML = `
    <strong>Venda #${d.displayId}</strong> — ${d.unit_label}<br>
    <strong>Tipo:</strong> <span class="tag tag-type" style="margin-top:4px">${disputeTypeLabel(d.saleId)}</span><br><br>
    <div style="background:#fff3e0;border-radius:8px;padding:10px 12px;margin-bottom:8px">
      <strong>⚔️ Contestação de ${shortName(d.claimant)}:</strong><br>
      <span style="font-size:13px">${d.reason}</span>
    </div>
    <div style="background:${d.defense ? '#e8f5e9' : '#f5f5f5'};border-radius:8px;padding:10px 12px">
      <strong>🛡️ Defesa de ${shortName(d.originalConsultant)}:</strong><br>
      <span style="font-size:13px">${d.defense || '<em style="color:#999">Sem defesa registrada</em>'}</span>
    </div>
  `;

}

async function resolveDispute(action) {
  const res = document.getElementById('resolve-reason').value.trim();
  if (!res) { alert('Informe a justificativa da decisão.'); return; }
  const d = disputes[pendingResolveIdx];
  d.status     = 'resolved';
  d.action     = action;
  d.resolution = res;
  d.resolvedBy = session.name;
  d.resolvedAt = new Date().toLocaleDateString('pt-BR');
  saveDisputesLocal(disputes);
  closeModal('modal-resolve');
  buildSectionNav();
  renderSection('disputes');
  await sbUpdateDispute(d);
}

// Desfaz a decisão (ex.: coordenador decidiu errado): a disputa volta para "Em Aberto".
// Mantém contestação e defesa; limpa decisão e responsável. Se a decisão era "transferir",
// a venda volta sozinha para o consultor original (a transferência só vale para disputa resolvida).
async function reopenDispute(idx) {
  const d = disputes[idx];
  if (!d || d.status !== 'resolved') return;
  const decisao = d.action === 'transfer' ? `A venda #${d.displayId} volta para ${shortName(d.originalConsultant)}.` : 'A venda continua com o consultor atual.';
  if (!confirm(`Reabrir a disputa #${d.displayId}?

${decisao}
A decisão anterior será apagada e a disputa volta para "Em Aberto".`)) return;
  d.status     = 'open';
  d.action     = null;
  d.resolution = null;
  d.resolvedBy = null;
  d.resolvedAt = null;
  saveDisputesLocal(disputes);
  destroyCharts();
  buildSectionNav();
  renderSection('disputes');
  await sbUpdateDispute(d);
}

//  EXPORTAR PLANILHA
// ══════════════════════════════════════════════
function exportSalesCSV() {
  const sales = pricedSales(getFilteredSales(null, {includeUnassigned: false}));

  const rows = sales.map(s => {
    const dispute = disputes.find(d => d.saleId === s.line_id && d.unit === s.unit && d.status === 'resolved');
    const origem  = s._manual ? 'Manual' : (dispute ? 'Disputa resolvida' : 'Relatório');
    return {
      'ID':          s.id,
      'Aluno':       s.student,
      'Consultor':   s.consultant,
      'Papel':       roleLabel(s) || (s.type === 'new' ? 'Novo' : 'Rematrícula'),
      'Tipo':        s.type === 'new' ? 'Novo' : 'Rematrícula',
      'Bônus (R$)': s.commission,
      'Data':        s.date,
      'Contrato':    s.contract,
      'Unidade':     s.unit_label,
      'Mês':         s.month,
      'Origem':      origem,
    };
  });

  // Descontos por não conformidade entram como linhas negativas, pra o total do CSV
  // bater com o que a aba Mensal mostra (que já vem líquido de desconto).
  deductions
    .filter(d => d.month === activeMonth && (!activeUnit || d.unit === activeUnit))
    .forEach(d => rows.push({
      'ID': '—', 'Aluno': '—', 'Consultor': d.consultant, 'Papel': 'Desconto',
      'Tipo': 'Desconto', 'Bônus (R$)': -Number(d.amount), 'Data': d.createdAt,
      'Contrato': d.reason, 'Unidade': d.unit_label, 'Mês': d.month, 'Origem': 'Desconto',
    }));

  if (!rows.length) { alert('Nenhuma venda para exportar.'); return; }

  const headers = Object.keys(rows[0]);
  const escape  = v => `"${String(v).replace(/"/g, '""')}"`;
  const csvContent = [
    headers.map(escape).join(';'),
    ...rows.map(r => headers.map(h => escape(r[h])).join(';'))
  ].join('\n');

  const blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const unit = activeUnit ? UNIT_LABELS[activeUnit].replace(/\s+/g,'_') : 'Todas_Unidades';
  a.href     = url;
  a.download = `Bonus_${MONTH.replace('/','_')}_${unit}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

(async function init() {
  // restos do login antigo
  [SESSION_KEY, USERS_KEY, 'positiva_users_ver'].forEach(k => localStorage.removeItem(k));
  const { data: { session: s } } = await db.auth.getSession();
  if (!s) { location.replace('../index.html'); return; }
  const { data: p } = await db.from('profiles').select('*').eq('id', s.user.id).maybeSingle();
  if (!p || !p.ativo || !p.acesso_bonus || !p.papel_bonus) { location.replace('../index.html'); return; }
  session = {
    login: p.email || s.user.email,
    name: p.nome_bonus || p.nome,          // precisa ser igual ao nome nas vendas
    role: p.papel_bonus === 'coordinator' ? 'coordinator' : 'consultant',
    super: !!p.super_admin,
  };
  if (session.role === 'coordinator' && !p.super_admin) UNIDADES_PERMITIDAS = p.unidades_coord || [];
  document.getElementById('btn-trocar').hidden = !(p.acesso_tarefas && p.papel_tarefas);

    document.getElementById('carregando-msg').textContent = 'Não foi possível carregar o bônus. Atualize a página.';
    return;
  }
  await carregarConfigBonus();
